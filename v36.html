body{

#gameCanvas{

/* =========================
   AUTH SCREEN
========================= */

#authScreen{

.authCard{

  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  padding:26px;

}

.authCard h1{
  margin:0 0 5px;
  text-align:center;
  font-size:30px;
}

.authCard .subtitle{
  text-align:center;
  color:#b8c9be;
  margin-bottom:22px;
}

.authCard input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:none;
  border-radius:12px;
  background:#26352c;
  color:#fff;
  outline:none;
}

.authButtons{
  display:flex;
  gap:10px;

}

.authButtons button{

}

button{

  border-radius:12px;

}

button:active{

.secondary{

.authMessage{

/* =========================
   CREATE CHARACTER
========================= */

  background:#26352c;
  color:#fff;

#createMessage{

  text-align:center;
  color:#ffd66b;
  font-size:13px;
}

/* =========================
   HUD
========================= */

.topBar{

}

.stats{

}

.stats strong{
  display:block;
  font-size:15px;

.statLine{

  margin:3px 0;
  color:#e7eee9;
}

.topButtons{
  display:flex;
  gap:7px;

}

.hudBtn{
  padding:10px 11px;
  border-radius:12px;
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.15);
  font-size:13px;
}

/* =========================
   ONLINE BADGE
========================= */

#onlineBadge{

  top:112px;
  left:12px;

  display:none;
  background:rgba(0,0,0,.72);
  border-radius:12px;
  padding:8px 11px;
  font-size:12px;
  border:1px solid rgba(255,255,255,.12);
}

/* =========================
   LOCATION
========================= */

#locationBadge{

  top:145px;
  left:12px;

  display:none;
  background:rgba(0,0,0,.72);
  border-radius:12px;
  padding:8px 11px;
  font-size:12px;
}

/* =========================
   D PAD
========================= */

  height:145px;
}

.dpad{
  position:relative;
  width:145px;
  height:145px;
}

.dpad button{
  position:absolute;
  width:48px;
  height:48px;
  padding:0;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.2);
  font-size:20px;
  border-radius:13px;
}

.up{
  top:0;
  left:48px;
}

.down{
  bottom:0;
  left:48px;
}

.left{
  left:0;
  top:48px;
}

.right{
  right:0;
  top:48px;
}

.center{
  left:48px;
  top:48px;

/* =========================
   RUN BUTTON
========================= */

#runButton{

  right:25px;
  bottom:35px;

  height:76px;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  border:2px solid rgba(255,255,255,.2);
  font-size:14px;
}

/* =========================
   CHAT
========================= */

#chatToggle{

  right:18px;
  bottom:125px;
  z-index:40;
  display:none;
  width:58px;
  height:58px;

  padding:0;

#chatPanel{

  right:18px;
  bottom:190px;

  border:1px solid rgba(255,255,255,.15);

/* =========================

  pointer-events:none;
}

.toast{
  background:rgba(0,0,0,.86);
  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;
  padding:11px 13px;
  margin-bottom:7px;
  text-align:center;
  font-size:13px;
  animation:toastIn .2s ease;
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   INTERACTION PROMPT

#interactionPrompt{

/* =========================

function resizeCanvas(){

  canvas.width =
    window.innerWidth *
    window.devicePixelRatio;

  canvas.height =
    window.innerHeight *
    window.devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    window.devicePixelRatio,
    0,
    0,
    window.devicePixelRatio,
    0,
    0
  );

}

);

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );

}


function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    String(value ?? "");

  return div.innerHTML;

}


function formatMoney(value){

){

========================================================= */

function normalizeGame(){

  if(
    !game ||
    typeof game !== "object"
  ){

    game = {};

  }

  if(
    !game.character ||
    typeof game.character !== "object"
  ){

    game.character = {
      name:"",
      age:18
    };

  }

  if(!Array.isArray(game.inventory)){

    game.inventory = [];

  }

  if(
    !game.friendship ||
    typeof game.friendship !== "object"
  ){

    game.friendship = {};

  }

  if(!Array.isArray(game.achievements)){

    game.achievements = [];

  }

  if(
    typeof game.x !== "number"
  ){

    game.x = 1100;

  }

  if(
    typeof game.y !== "number"
  ){

    game.y = 750;

  }

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function getStorageKey(){

  return currentUser
    ? "kadunaLife_" + currentUser.id
    : "kadunaLife_guest";

}


function loadLocalGame(){

  try{

    const raw =
      localStorage.getItem(
        getStorageKey()
      );

    if(raw){

      game =
        Object.assign(
          game,
          JSON.parse(raw)
        );

    }

  }catch(error){

    console.warn(
      "Local save error",
      error
    );

  }

  normalizeGame();

}


function saveLocalGame(){

  normalizeGame();

  try{

    localStorage.setItem(
      getStorageKey(),
      JSON.stringify(game)
    );

  }catch(error){

    console.warn(
      "Local save error",
      error
    );

  }

}

  const profile = {

    id:currentUser.id,

    name:game.character.name,

    age:Number(game.character.age),

  };

    await supabaseClient
      .from("profiles")
      .upsert(
        profile,
        {
          onConflict:"id"
        }
      );

  if(error){

    console.warn(
      "Cloud save failed:",
      error
    );

    showToast(
      "⚠️ Local save complete. Cloud save unavailable."
    );

    return;

  }

  showToast(
    "💾 Game saved"
  );

}


/* =========================================================
   LOAD CLOUD PROFILE
========================================================= */

async function loadCloudGame(){

  if(!currentUser){

    return false;

  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if(error){

    console.warn(
      "Cloud profile read error:",
      error
    );

    return false;

  }

  if(
    data &&
    data.game_state
  ){

    game =
      Object.assign(
        game,
        data.game_state
      );

    normalizeGame();

    saveLocalGame();

    return true;

  }

  return false;

}

/* =========================================================
   REALTIME
========================================================= */

async function connectRealtime(){

  if(!currentUser){

    return;

  }

  if(realtimeChannel){

    try{

      await supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }catch(e){}

  }

  realtimeChannel =
    supabaseClient.channel(
      "kaduna-world",
      {
        config:{
          presence:{
            key:currentUser.id
          },

          broadcast:{
            self:false
          }
        }
      }
    );


  /* =========================
     PLAYER MOVEMENT
  ========================= */

  realtimeChannel.on(
    "broadcast",
    {
      event:"player-move"
    },
    payload=>{

      const p =
        payload.payload;

      if(!p || p.userId === currentUser.id){

        return;

      }

      remotePlayers[p.userId] =
        Object.assign(
          remotePlayers[p.userId] || {},
          {
            id:p.userId,
            name:p.name || "Player",
            age:p.age || 18,
            x:Number(p.x) || 0,
            y:Number(p.y) || 0,
            color:p.color || "#60a5fa",
            lastMove:Date.now(),
            bubble:
              remotePlayers[p.userId]
                ?.bubble || "",
            bubbleUntil:
              remotePlayers[p.userId]
                ?.bubbleUntil || 0
          }
        );

    }
  );


  /* =========================
     CHAT
  ========================= */

  realtimeChannel.on(
    "broadcast",
    {
      event:"chat-message"
    },
    payload=>{

      const p =
        payload.payload;

      if(!p || p.userId === currentUser.id){

        return;

      }

      const name =
        p.name || "Player";

      const message =
        String(
          p.message || ""
        ).slice(0,120);

      addChatMessage(
        name,
        message
      );

      if(
        remotePlayers[p.userId]
      ){

        remotePlayers[p.userId].bubble =
          message;

        remotePlayers[p.userId].bubbleUntil =
          Date.now() + 6000;

      }

      showToast(
        "💬 " + name + ": " + message
      );

    }
  );


  /* =========================
     PLAYER ACTIONS
  ========================= */

  realtimeChannel.on(
    "broadcast",
    {
      event:"player-action"
    },
    payload=>{

      const p =
        payload.payload;

      if(
        !p ||
        p.userId === currentUser.id
      ){

        return;

      }

      const name =
        p.name || "Player";

      const action =
        p.action;

      const actionText = {

        wave:"👋 waved at you!",

        hello:"💬 said hello!",

        highfive:"✋ sent you a high-five!",

        cheer:"🎉 cheered for you!"

      }[action] || "interacted with you!";


      if(
        remotePlayers[p.userId]
      ){

        remotePlayers[p.userId].bubble =
          action === "wave"
            ? "👋"
            : action === "hello"
              ? "Hello!"
              : action === "highfive"
                ? "✋"
                : "🎉";

        remotePlayers[p.userId].bubbleUntil =
          Date.now() + 3000;

      }

      addSystemMessage(
        name + " " + actionText
      );

      showToast(
        name + " " + actionText
      );

    }
  );


  /* =========================
     PRESENCE
  ========================= */

  realtimeChannel.on(
    "presence",
    {
      event:"sync"
    },
    ()=>{

      syncPresence();

    }
  );


  realtimeChannel.on(
    "presence",
    {
      event:"join"
    },
    ({key,newPresences})=>{

      if(key !== currentUser.id){

        const person =
          newPresences &&
          newPresences[0];

        if(person){

          showToast(
            "🟢 " +
            (person.name || "A player") +
            " joined Kaduna."
          );

        }

      }

      syncPresence();

    }
  );


  realtimeChannel.on(
    "presence",
    {
      event:"leave"
    },
    ({key})=>{

      if(key !== currentUser.id){

        const old =
          remotePlayers[key];

        if(old){

          showToast(
            "🔴 " +
            old.name +
            " left Kaduna."
          );

        }

        delete remotePlayers[key];

      }

      syncPresence();

    }
  );


  realtimeChannel.subscribe(
    async(status)=>{

      if(status !== "SUBSCRIBED"){

        return;

      }

      await realtimeChannel.track({

        userId:currentUser.id,

        name:
          game.character.name,

        age:
          Number(game.character.age),

        x:
          game.x,

        y:
          game.y,

        color:
          playerColor(),

        onlineAt:
          new Date().toISOString()

      });

      syncPresence();

    }
  );

}


/* =========================================================
   PRESENCE SYNC
========================================================= */

function syncPresence(){

  if(!realtimeChannel){

    return;

  }

  const state =
    realtimeChannel.presenceState();

  presenceState =
    state || {};

  const ids =
    Object.keys(
      presenceState
    ).filter(
      id=>id !== currentUser.id
    );


  for(const id of ids){

    const entries =
      presenceState[id];

    const p =
      entries &&
      entries[0];

    if(!p){

      continue;

    }

    if(!remotePlayers[id]){

      remotePlayers[id] = {

        id,

        name:p.name || "Player",

        age:p.age || 18,

        x:Number(p.x) || 0,

        y:Number(p.y) || 0,

        color:p.color || "#60a5fa",

        lastMove:Date.now(),

        bubble:"",

        bubbleUntil:0

      };

    }

  }


  for(const id of Object.keys(remotePlayers)){

    if(!ids.includes(id)){

      delete remotePlayers[id];

    }

  }


  updateOnlineCount();

}


function updateOnlineCount(){

  let count = 1;

  for(const id of Object.keys(presenceState)){

    if(id !== currentUser.id){

      count++;

    }

  }

  document.getElementById(
    "onlineCount"
  ).textContent =
    count;

}


/* =========================================================
   PLAYER COLOR
========================================================= */

function playerColor(){

  const colors = [

    "#ef4444",

    "#3b82f6",

    "#22c55e",

    "#f59e0b",

    "#a855f7",

    "#ec4899",

    "#14b8a6",

    "#f97316"

  ];

  let hash = 0;

  const id =
    currentUser
      ? currentUser.id
      : "player";

  for(
    let i=0;
    i<id.length;
    i++
  ){

    hash =
      id.charCodeAt(i) +
      ((hash << 5) - hash);

  }

  return colors[
    Math.abs(hash) %
    colors.length
  ];

}

/* =========================================================
   FIND NEAREST PLAYER
========================================================= */

function findNearestPlayer(){

  let nearest =
    null;

  let nearestDistance =
    Infinity;

  for(
    const id of Object.keys(
      remotePlayers
    )
  ){

    const p =
      remotePlayers[id];

    const distance =
      Math.hypot(
        game.x - p.x,
        game.y - p.y
      );

    if(
      distance <
      nearestDistance
    ){

      nearestDistance =
        distance;

      nearest =
        p;

    }

  }

  if(
    nearest &&
    nearestDistance <=
    INTERACTION_DISTANCE
  ){

    nearest.distance =
      nearestDistance;

    return nearest;

  }

  return null;

}

/* =========================================================
   LOCATION DETECTION
========================================================= */

function getCurrentLocation(){

  for(
    const location of LOCATIONS
  ){

    if(

      game.x >= location.x &&
      game.x <= location.x + location.w &&

      game.y >= location.y &&
      game.y <= location.y + location.h

    ){

      return location.name;

    }

  }

  return "Kaduna Streets";

}

  document.getElementById(

  ).textContent =
    getCurrentLocation();

}


/* =========================================================
   COLLISION
========================================================= */

function isInsideBuilding(
  x,
  y
){

  const padding =
    18;

  for(
    const location of LOCATIONS
  ){

    if(

      x + padding >
      location.x &&

      x - padding <
      location.x +
      location.w &&

      y + padding >
      location.y &&

      y - padding <
      location.y +
      location.h

    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(
  dx,
  dy,
  speed
){

  if(
    !isGameRunning
  ){

    return;

  }

  const length =
    Math.hypot(dx,dy);

  if(length > 0){

    dx /= length;

    dy /= length;

  }

  const amount =
    speed;

  const newX =
    clamp(
      game.x +
      dx * amount,
      25,
      WORLD_WIDTH - 25
    );

  const newY =
    clamp(
      game.y +
      dy * amount,
      25,
      WORLD_HEIGHT - 25
    );


  if(
    !isInsideBuilding(
      newX,
      game.y
    )
  ){

    game.x =
      newX;

  }


  if(
    !isInsideBuilding(
      game.x,
      newY
    )
  ){

    game.y =
      newY;

  }

}

/* =========================================================
   TOUCH D PAD
========================================================= */

document
  .querySelectorAll(
    "#controls button[data-dir]"
  )
  .forEach(button=>{

    const direction =
      button.dataset.dir;


    function start(){

      if(direction === "up"){

        dpadDirection =
          {x:0,y:-1};

      }

      if(direction === "down"){

        dpadDirection =
          {x:0,y:1};

      }

      if(direction === "left"){

        dpadDirection =
          {x:-1,y:0};

      }

      if(direction === "right"){

        dpadDirection =
          {x:1,y:0};

      }

    }


    function stop(){

      dpadDirection =
        {x:0,y:0};

    }


    button.addEventListener(
      "touchstart",
      event=>{

        event.preventDefault();

        start();

      },
      {passive:false}
    );


    button.addEventListener(
      "touchend",
      event=>{

        event.preventDefault();

        stop();

      },
      {passive:false}
    );


    button.addEventListener(
      "mousedown",
      start
    );

    button.addEventListener(
      "mouseup",
      stop
    );

    button.addEventListener(
      "mouseleave",
      stop
    );

  });

/* =========================================================
   GET KEYBOARD DIRECTION
========================================================= */

function getKeyboardDirection(){

  let dx = 0;

  let dy = 0;


  if(
    keys["w"] ||
    keys["arrowup"]
  ){

    dy -= 1;

  }

  if(
    keys["s"] ||
    keys["arrowdown"]
  ){

    dy += 1;

  }

  if(
    keys["a"] ||
    keys["arrowleft"]
  ){

    dx -= 1;

  }

  if(
    keys["d"] ||
    keys["arrowright"]
  ){

    dx += 1;

  }


  return {
    x:dx,
    y:dy
  };

}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  ctx.fillStyle =
    "#72b657";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  /* =========================
     GROUND
  ========================= */

  ctx.fillStyle =
    "#78b95c";

  ctx.fillRect(
    0,
    0,
    WORLD_WIDTH,
    WORLD_HEIGHT
  );


  /* =========================
     ROAD NETWORK
  ========================= */

  ctx.fillStyle =
    "#5b6165";

  ctx.fillRect(
    0,
    650,
    WORLD_WIDTH,
    150
  );

  ctx.fillRect(
    900,
    0,
    160,
    WORLD_HEIGHT
  );

  ctx.fillRect(
    0,
    350,
    WORLD_WIDTH,
    80
  );

  ctx.fillRect(
    1450,
    0,
    80,
    WORLD_HEIGHT
  );


  /* =========================
     ROAD LINES
  ========================= */

  ctx.strokeStyle =
    "#e7d46b";

  ctx.lineWidth =
    4;

  ctx.setLineDash([
    25,
    20
  ]);


  ctx.beginPath();

  ctx.moveTo(
    0,
    725
  );

  ctx.lineTo(
    WORLD_WIDTH,
    725
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    980,
    0
  );

  ctx.lineTo(
    980,
    WORLD_HEIGHT
  );

  ctx.stroke();


  ctx.setLineDash([]);


  /* =========================
     BUILDINGS
  ========================= */

  for(
    const location of LOCATIONS
  ){

    ctx.fillStyle =
      "rgba(0,0,0,.18)";

    ctx.fillRect(
      location.x + 8,
      location.y + 9,
      location.w,
      location.h
    );


    ctx.fillStyle =
      location.color;

    ctx.fillRect(
      location.x,
      location.y,
      location.w,
      location.h
    );


    ctx.strokeStyle =
      "rgba(0,0,0,.35)";

    ctx.lineWidth =
      3;

    ctx.strokeRect(
      location.x,
      location.y,
      location.w,
      location.h
    );


    ctx.fillStyle =
      "#fff";

    ctx.font =
      "bold 15px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      location.name,
      location.x +
      location.w / 2,
      location.y +
      location.h / 2
    );

  }


  /* =========================
     TREES
  ========================= */

  drawTree(
    130,
    180
  );

  drawTree(
    210,
    950
  );

  drawTree(
    760,
    150
  );

  drawTree(
    2020,
    500
  );

  drawTree(
    2040,
    1350
  );

  drawTree(
    800,
    1380
  );

  drawTree(
    1370,
    1320
  );


  /* =========================
     NPCS
  ========================= */

  for(
    const npc of NPCS
  ){

    drawCharacter(
      npc.x,
      npc.y,
      npc.color,
      npc.name,
      false
    );

  }


  /* =========================
     REMOTE PLAYERS
  ========================= */

  for(
    const id of Object.keys(
      remotePlayers
    )
  ){

    const player =
      remotePlayers[id];

    drawCharacter(
      player.x,
      player.y,
      player.color,
      player.name,
      true,
      player.bubble,
      player.bubbleUntil
    );

  }


  /* =========================
     LOCAL PLAYER
  ========================= */

  drawCharacter(
    game.x,
    game.y,
    playerColor(),
    game.character.name,
    true,
    localBubble,
    localBubbleUntil,
    true
  );


  ctx.restore();

}


/* =========================================================
   TREE
========================================================= */

function drawTree(
  x,
  y
){

  ctx.fillStyle =
    "#754c24";

  ctx.fillRect(
    x - 7,
    y,
    14,
    40
  );

  ctx.beginPath();

  ctx.fillStyle =
    "#287a38";

  ctx.arc(
    x,
    y,
    32,
    0,
    Math.PI * 2
  );

  ctx.fill();

}


/* =========================================================
   CHARACTER
========================================================= */

function drawCharacter(
  x,
  y,
  color,
  name,
  isPlayer,
  bubble,
  bubbleUntil,
  isLocal=false
){

  /* shadow */

  ctx.beginPath();

  ctx.fillStyle =
    "rgba(0,0,0,.25)";

  ctx.ellipse(
    x,
    y + 18,
    17,
    7,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* body */

  ctx.beginPath();

  ctx.fillStyle =
    color;

  ctx.arc(
    x,
    y,
    15,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* head */

  ctx.beginPath();

  ctx.fillStyle =
    "#d6a77a";

  ctx.arc(
    x,
    y - 22,
    10,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* player ring */

  if(isPlayer){

    ctx.beginPath();

    ctx.strokeStyle =
      isLocal
        ? "#ffffff"
        : "rgba(255,255,255,.65)";

    ctx.lineWidth =
      2;

    ctx.arc(
      x,
      y,
      20,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  /* name */

  ctx.font =
    "bold 11px Arial";

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#fff";

  ctx.fillText(
    name,
    x,
    y + 38
  );


  /* online */

  if(isPlayer && !isLocal){

    ctx.font =
      "9px Arial";

    ctx.fillStyle =
      "#8ff0a7";

    ctx.fillText(
      "ONLINE",
      x,
      y + 49
    );

  }


  /* chat bubble */

  if(
    bubble &&
    bubbleUntil >
    Date.now()
  ){

    drawBubble(
      x,
      y - 50,
      bubble
    );

  }

}


/* =========================================================
   CHAT BUBBLE
========================================================= */

function drawBubble(
  x,
  y,
  message
){

  const maxWidth =
    150;

  ctx.font =
    "12px Arial";

  let text =
    String(message);

  if(text.length > 28){

    text =
      text.slice(
        0,
        27
      ) + "…";

  }

  const width =
    Math.min(
      maxWidth,
      ctx.measureText(text).width + 20
    );

  const height =
    30;


  ctx.fillStyle =
    "rgba(0,0,0,.9)";

  ctx.beginPath();

  ctx.roundRect(
    x - width / 2,
    y - height,
    width,
    height,
    10
  );

  ctx.fill();


  ctx.fillStyle =
    "#fff";

  ctx.textAlign =
    "center";

  ctx.fillText(
    text,
    x,
    y - 11
  );

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  camera.x =
    game.x -
    width / 2;

  camera.y =
    game.y -
    height / 2;


  camera.x =
    clamp(
      camera.x,
      0,
      WORLD_WIDTH -
      width
    );

  camera.y =
    clamp(
      camera.y,
      0,
      WORLD_HEIGHT -
      height
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(
  timestamp
){

  if(!isGameRunning){

    return;

  }


  const delta =
    timestamp -
    lastFrame;

  lastFrame =
    timestamp;


  let direction =
    getKeyboardDirection();


  if(
    dpadDirection.x !== 0 ||
    dpadDirection.y !== 0
  ){

    direction =
      dpadDirection;

  }


  if(
    direction.x !== 0 ||
    direction.y !== 0
  ){

    movePlayer(

      direction.x,

      direction.y,

      running
        ? RUN_SPEED
        : PLAYER_SPEED

    );

    game.energy =
      clamp(
        game.energy -
        (
          running
            ? .035
            : .012
        ) *
        Math.max(
          1,
          delta / 16
        ),
        0,
        100
      );

  }else{

    game.energy =
      clamp(
        game.energy +
        .006 *
        Math.max(
          1,
          delta / 16
        ),
        0,
        100
      );

  }


  updateCamera();

  updateLocation();

  updateInteractionPrompt();

  broadcastMovement();

  drawWorld();

  requestAnimationFrame(
    gameLoop
  );

}
