<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaduna Life — V1</title>
<style>
:root{--bg:#101827;--panel:#182235;--panel2:#202d44;--text:#f4f7fb;--muted:#aab7ca;--accent:#f0b429;--good:#35c759;--bad:#ff6b6b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#0e1625,#18283a);color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#17120a;font-weight:700}
.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.brand h1{margin:0;font-size:28px}.brand p{margin:3px 0;color:var(--muted)}
.money{font-size:20px;font-weight:800;background:var(--panel);padding:12px 16px;border-radius:14px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.panel{background:rgba(24,34,53,.94);border:1px solid #2d3b53;border-radius:18px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel2);padding:10px;border-radius:12px}.stat b{display:block}.bar{height:8px;background:#334057;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent)}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.loc{min-height:90px;background:#24344d;border:1px solid #334863;color:var(--text);text-align:left}.loc small{display:block;color:var(--muted);font-weight:500;margin-top:5px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.actions button{background:#2a3a55;color:var(--text);border:1px solid #3b4e6c}.actions button:hover,.loc:hover{background:#344967}
.log{height:235px;overflow:auto;background:#0d1420;border-radius:12px;padding:10px;font-size:14px}.log div{padding:7px 0;border-bottom:1px solid #202b3b}
.card{background:#202d44;border-radius:14px;padding:12px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}.tag{font-size:12px;color:#101722;background:var(--accent);padding:4px 7px;border-radius:999px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px}.modal>div{width:min(520px,100%);background:var(--panel);padding:22px;border-radius:18px}.modal input,.modal select{width:100%;padding:12px;margin:7px 0 12px;border-radius:10px;border:1px solid #40516b;background:#111a29;color:white}
.hidden{display:none!important}.footer{margin-top:12px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:780px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.map{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1>🇳🇬 Kaduna Life</h1><p>Your Kaduna. Your Story.</p></div>
    <div class="money" id="money">₦10,000</div>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="row"><h2 id="playerName">New Player</h2><span class="tag" id="jobTag">Unemployed</span></div>
      <p class="muted" id="homeText">Room • Kaduna Central</p>
      <div class="stats" id="stats"></div>

      <h3>Explore Kaduna</h3>
      <div class="map">
        <button class="loc" onclick="visit('Kawo')">📍 Kawo<small>Shops & transport</small></button>
        <button class="loc" onclick="visit('Kaduna Central')">📍 Kaduna Central<small>Bank & city centre</small></button>
        <button class="loc" onclick="visit('Malali')">📍 Malali<small>Homes & cafés</small></button>
        <button class="loc" onclick="visit('Barnawa')">📍 Barnawa<small>Markets & services</small></button>
        <button class="loc" onclick="visit('Kakuri')">📍 Kakuri<small>Industry</small></button>
        <button class="loc" onclick="visit('Sabon Tasha')">📍 Sabon Tasha<small>Neighbourhood life</small></button>
      </div>

      <h3>Actions</h3>
      <div class="actions">
        <button onclick="work()">💼 Work</button>
        <button onclick="eat()">🍲 Eat</button>
        <button onclick="rest()">🛏️ Rest</button>
        <button onclick="socialize()">🗣️ Socialize</button>
        <button onclick="shop()">🛍️ Shop</button>
        <button onclick="randomEvent()">🎲 Life Event</button>
      </div>
    </section>

    <aside class="panel">
      <div class="row"><h2>Career</h2><button onclick="openCareer()">Change</button></div>
      <div id="careerCard" class="card"></div>
      <h3>Housing</h3>
      <div id="houseCard" class="card"></div>
      <button onclick="upgradeHouse()" style="width:100%">🏠 Upgrade House</button>
      <h3>Life Log</h3>
      <div class="log" id="log"></div>
      <div class="actions">
        <button onclick="saveGame()">💾 Save</button>
        <button onclick="resetGame()">↻ New Life</button>
      </div>
    </aside>
  </div>
  <div class="footer">Kaduna Life V1 prototype • fictional game economy; no real-money transactions.</div>
</div>

<div class="modal hidden" id="modal">
  <div>
    <h2>Create your character</h2>
    <label>Name</label><input id="nameInput" placeholder="Enter a name">
    <label>Starting ambition</label>
    <select id="ambition"><option>Business Mogul</option><option>Tech Founder</option><option>Creative</option><option>Academic</option><option>Property Owner</option></select>
    <button onclick="startGame()">Start Life</button>
  </div>
</div>

<script>
const careers = {
  "Content Creator": {pay:1800, skill:"Creativity", desc:"Build an audience and improve your creative skill."},
  "Designer": {pay:2000, skill:"Creativity", desc:"Create designs for local clients."},
  "Teacher": {pay:1700, skill:"Intelligence", desc:"Teach, learn and build your reputation."},
  "Tech Worker": {pay:2500, skill:"Intelligence", desc:"Work on digital projects."},
  "Shop Owner": {pay:2200, skill:"Business", desc:"Run a growing neighbourhood business."},
  "Food Business": {pay:2100, skill:"Business", desc:"Serve customers and grow your food business."}
};
const houses = [
  {name:"Room",price:0,bonus:0},
  {name:"Self-contained",price:18000,bonus:5},
  {name:"2-bedroom Flat",price:45000,bonus:10},
  {name:"3-bedroom Flat",price:90000,bonus:15},
  {name:"Duplex",price:180000,bonus:25}
];
let state = {
  name:"", money:10000, job:"Unemployed", home:0,
  energy:85, hunger:80, happiness:70, social:50,
  creativity:10, intelligence:10, business:10,
  ambition:"Business Mogul", location:"Kaduna Central", log:[]
};

function fmt(n){return "₦"+Math.max(0,Math.round(n)).toLocaleString("en-NG")}
function addLog(s){state.log.unshift("• "+s);state.log=state.log.slice(0,40);document.getElementById("log").innerHTML=state.log.map(x=>"<div>"+x+"</div>").join("")}
function clamp(v){return Math.max(0,Math.min(100,v))}
function render(){
 document.getElementById("money").textContent=fmt(state.money);
 document.getElementById("playerName").textContent=state.name||"New Player";
 document.getElementById("jobTag").textContent=state.job;
 document.getElementById("homeText").textContent=houses[state.home].name+" • "+state.location;
 const stats=[["Energy",state.energy],["Hunger",state.hunger],["Happiness",state.happiness],["Social",state.social],["Creativity",state.creativity],["Intelligence",state.intelligence],["Business",state.business]];
 document.getElementById("stats").innerHTML=stats.map(([n,v])=>`<div class="stat"><b>${n}</b><span>${Math.round(v)}</span><div class="bar"><i style="width:${clamp(v)}%"></i></div></div>`).join("");
 const c=careers[state.job];
 document.getElementById("careerCard").innerHTML=state.job==="Unemployed"?`<b>Looking for work</b><p class="muted">Choose a career to start earning.</p>`:`<b>${state.job}</b><p>${c.desc}</p><span class="tag">${fmt(c.pay)} / work day</span>`;
 const h=houses[state.home], next=houses[state.home+1];
 document.getElementById("houseCard").innerHTML=next?`<b>${h.name}</b><p class="muted">Next: ${next.name} • ${fmt(next.price)}</p>`:`<b>${h.name}</b><p class="muted">Top house in V1.</p>`;
 document.getElementById("log").innerHTML=state.log.map(x=>"<div>"+x+"</div>").join("");
}
function requirePlayer(){if(!state.name){document.getElementById("modal").classList.remove("hidden");return false}return true}
function startGame(){
 const n=document.getElementById("nameInput").value.trim();
 if(!n)return;
 state.name=n;state.ambition=document.getElementById("ambition").value;
 document.getElementById("modal").classList.add("hidden");
 addLog(`Welcome to Kaduna, ${state.name}. Ambition: ${state.ambition}.`);
 render();saveGame(false);
}
function work(){if(!requirePlayer())return;if(state.job==="Unemployed"){openCareer();return}if(state.energy<20||state.hunger<15){addLog("You're too tired or hungry to work.");render();return}
 const c=careers[state.job];state.money+=c.pay;state.energy-=20;state.hunger-=12;state.happiness=clamp(state.happiness+3);
 state[c.skill.toLowerCase()]=clamp(state[c.skill.toLowerCase()]+2);
 addLog(`You worked as a ${state.job} and earned ${fmt(c.pay)}.`);render()
}
function eat(){if(!requirePlayer())return;if(state.money<500){addLog("You need at least ₦500 for a meal.");return}state.money-=500;state.hunger=clamp(state.hunger+35);state.happiness=clamp(state.happiness+4);addLog("You grabbed a meal for ₦500.");render()}
function rest(){if(!requirePlayer())return;state.energy=clamp(state.energy+35);state.hunger=clamp(state.hunger-8);addLog("You rested at home.");render()}
function socialize(){if(!requirePlayer())return;if(state.energy<10)return;state.social=clamp(state.social+15);state.happiness=clamp(state.happiness+8);state.energy-=10;addLog("You spent time with friends.");render()}
function shop(){if(!requirePlayer())return;if(state.money<1200){addLog("Not enough money for a small shopping trip.");return}state.money-=1200;state.happiness=clamp(state.happiness+12);addLog("You bought a few things around town.");render()}
function visit(place){if(!requirePlayer())return;state.location=place;state.energy=clamp(state.energy-5);addLog(`You travelled to ${place}.`);render()}
function randomEvent(){if(!requirePlayer())return;const events=[
 ["A neighbour recommended you for a small job.",1500,"money"],
 ["You helped a friend move and they gave you a thank-you gift.",800,"money"],
 ["A quiet day gave you time to learn.",3,"intelligence"],
 ["You met someone who liked your work and boosted your confidence.",7,"happiness"],
 ["Unexpected transport costs hit your budget.",-600,"money"]
];const e=events[Math.floor(Math.random()*events.length)];state[e[2]]+=e[1];if(e[2]==="happiness")state.happiness=clamp(state.happiness);addLog(e[0]+(e[2]==="money"?" "+(e[1]>=0?"+":"")+fmt(e[1]):""));render()}
function openCareer(){
 if(!requirePlayer())return;
 const names=Object.keys(careers);let msg="Choose a career:\\n\\n"+names.map((n,i)=>`${i+1}. ${n} — ${fmt(careers[n].pay)} per work day`).join("\\n");
 const pick=prompt(msg);
 const i=parseInt(pick)-1;
 if(names[i]){state.job=names[i];addLog(`You started a career as a ${state.job}.`);render()}
}
function upgradeHouse(){
 if(!requirePlayer())return;const next=houses[state.home+1];if(!next){addLog("You've reached the top housing tier in V1.");return}
 if(state.money<next.price){addLog(`You need ${fmt(next.price-state.money)} more for the ${next.name}.`);return}
 state.money-=next.price;state.home++;state.happiness=clamp(state.happiness+houses[state.home].bonus/3);addLog(`You upgraded your home to a ${next.name}.`);render()
}
function saveGame(show=true){localStorage.setItem("kadunaLifeSave",JSON.stringify(state));if(show)addLog("Game saved on this device.")}
function loadGame(){try{const s=localStorage.getItem("kadunaLifeSave");if(s){state=JSON.parse(s);addLog("Welcome back to Kaduna.");render();return true}}catch(e){}return false}
function resetGame(){if(confirm("Start a completely new life?")){localStorage.removeItem("kadunaLifeSave");location.reload()}}
if(!loadGame())document.getElementById("modal").classList.remove("hidden");
render();
</script>
</body>
</html>
