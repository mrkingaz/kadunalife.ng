<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kaduna Life — V33</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#0b1020;
  --panel:#121a2e;
  --panel2:#18233d;
  --card:#10182b;
  --line:#263553;
  --text:#f4f7fb;
  --muted:#9eabc2;
  --accent:#67e8a5;
  --accent2:#60a5fa;
  --danger:#fb7185;
  --warning:#fbbf24;
  --shadow:0 14px 40px rgba(0,0,0,.28);
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:
    radial-gradient(circle at top left,#162548 0,#0b1020 42%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#app{
  min-height:100vh;
}

/* AUTH */

.auth-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}

.auth-card{
  width:min(440px,100%);
  background:rgba(18,26,46,.94);
  border:1px solid var(--line);
  border-radius:26px;
  padding:26px;
  box-shadow:var(--shadow);
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:900;
  margin-bottom:5px;
}

.logo-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:18px;
}

.tab-btn{
  padding:12px;
  border-radius:12px;
  background:#0c1325;
  color:var(--muted);
}

.tab-btn.active{
  background:var(--accent);
  color:#07150d;
  font-weight:800;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
}

.form-group input{
  width:100%;
  background:#0c1325;
  border:1px solid var(--line);
  color:var(--text);
  padding:13px 14px;
  border-radius:12px;
  outline:none;
}

.form-group input:focus{
  border-color:var(--accent2);
}

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:13px;
  background:var(--accent);
  color:#07150d;
  font-weight:900;
}

.secondary-btn{
  width:100%;
  padding:12px;
  border-radius:13px;
  background:#24314d;
  color:white;
  font-weight:700;
}

.auth-message{
  margin-top:12px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

/* GAME */

.game-shell{
  min-height:100vh;
  padding-bottom:85px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  background:rgba(11,16,32,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}

.brand{
  font-size:18px;
  font-weight:900;
}

.brand span{
  color:var(--accent);
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#1b2843;
  color:white;
}

.content{
  width:min(1100px,100%);
  margin:auto;
  padding:16px;
}

.hero{
  background:
    linear-gradient(135deg,rgba(96,165,250,.18),rgba(103,232,165,.10)),
    var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  margin-bottom:14px;
}

.hero h1{
  margin:0 0 5px;
  font-size:27px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

.location-chip{
  display:inline-flex;
  margin-top:13px;
  background:#0b1426;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  color:#dbeafe;
  font-size:13px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-value{
  font-size:18px;
  font-weight:900;
  margin-top:5px;
}

.progress{
  height:6px;
  background:#26324b;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px;
}

.progress > div{
  height:100%;
  background:var(--accent);
  border-radius:20px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(10,15,29,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}

.nav-btn{
  padding:8px 4px;
  border-radius:12px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
}

.nav-btn.active{
  background:#1a2946;
  color:white;
}

.nav-icon{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

/* CARDS */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:20px 0 10px;
}

.section-title h2{
  margin:0;
  font-size:18px;
}

.section-title small{
  color:var(--muted);
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
}

.card h3{
  margin:0 0 7px;
  font-size:16px;
}

.card p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.action-btn{
  background:#243452;
  color:white;
  padding:10px 12px;
  border-radius:11px;
  font-weight:700;
  font-size:13px;
}

.action-btn.green{
  background:var(--accent);
  color:#06130c;
}

.action-btn.blue{
  background:#2563eb;
}

.action-btn.red{
  background:#7f1d1d;
}

.action-btn.gold{
  background:#7c5a0b;
}

/* MAP */

.map{
  position:relative;
  height:570px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:24px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    #172238;
  background-size:34px 34px;
  box-shadow:var(--shadow);
}

.map::before{
  content:"";
  position:absolute;
  left:48%;
  top:-10%;
  width:70px;
  height:120%;
  background:#2b3a57;
  transform:rotate(20deg);
  opacity:.75;
}

.map::after{
  content:"";
  position:absolute;
  top:43%;
  left:-5%;
  width:110%;
  height:58px;
  background:#2b3a57;
  transform:rotate(-8deg);
  opacity:.75;
}

.map-title{
  position:absolute;
  top:12px;
  left:12px;
  z-index:4;
  background:rgba(7,13,26,.86);
  padding:9px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:900;
}

.location-marker{
  position:absolute;
  z-index:8;
  width:118px;
  min-height:74px;
  transform:translate(-50%,-50%);
  background:#111a2d;
  border:1px solid #3a4a6d;
  border-radius:16px;
  color:white;
  padding:8px;
  text-align:center;
  box-shadow:0 9px 20px rgba(0,0,0,.28);
}

.location-marker:active{
  transform:translate(-50%,-50%) scale(.96);
}

.location-marker .emoji{
  font-size:24px;
}

.location-marker .name{
  font-size:11px;
  font-weight:900;
  margin-top:3px;
}

.location-marker .desc{
  color:#9eabc2;
  font-size:9px;
  margin-top:2px;
}

.player-marker{
  position:absolute;
  z-index:10;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--accent);
  color:#07150d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:3px solid #07150d;
  box-shadow:0 0 0 5px rgba(103,232,165,.14);
  transform:translate(-50%,-50%);
  transition:left .35s ease,top .35s ease;
}

.npc-marker{
  position:absolute;
  z-index:9;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#243c69;
  border:2px solid #6079a9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  transform:translate(-50%,-50%);
  box-shadow:0 8px 16px rgba(0,0,0,.25);
}

.map-controls{
  position:absolute;
  z-index:12;
  bottom:12px;
  right:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.map-control{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#111a2d;
  color:white;
  border:1px solid var(--line);
}

/* LOCATION PANEL */

.location-panel{
  margin-top:14px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
}

.location-header{
  display:flex;
  gap:12px;
  align-items:center;
}

.location-big-icon{
  width:56px;
  height:56px;
  border-radius:16px;
  background:#22314e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.location-header h2{
  margin:0;
}

.location-header p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* NPC */

.npc-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.npc-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.npc-top{
  display:flex;
  gap:10px;
  align-items:center;
}

.npc-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#243c69;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.npc-card h3{
  margin:0;
  font-size:15px;
}

.npc-card small{
  color:var(--muted);
}

.friendship{
  margin-top:10px;
}

.friendship-bar{
  height:7px;
  background:#26324b;
  border-radius:10px;
  overflow:hidden;
}

.friendship-bar div{
  height:100%;
  background:#f472b6;
}

/* INVENTORY */

.inventory-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.item{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  text-align:center;
}

.item-icon{
  font-size:27px;
}

.item-name{
  font-weight:800;
  margin-top:6px;
  font-size:13px;
}

.item-count{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* PROFILE */

.profile-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
}

.profile-avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#253b66;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  margin-bottom:12px;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.68);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}

.modal{
  width:min(620px,100%);
  max-height:88vh;
  overflow:auto;
  background:#10192d;
  border:1px solid var(--line);
  border-radius:24px 24px 0 0;
  padding:20px;
  box-shadow:0 -15px 50px rgba(0,0,0,.4);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.modal-head h2{
  margin:0;
}

.close-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#25334f;
  color:white;
}

.modal-body{
  color:#dce4f2;
}

.modal-note{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  z-index:200;
  background:#10192d;
  color:white;
  border:1px solid var(--line);
  padding:11px 15px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
  box-shadow:var(--shadow);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* EVENT LOG */

.log{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.log-entry{
  background:#0d1527;
  border:1px solid #202e49;
  border-radius:12px;
  padding:10px 12px;
  color:#cdd7e8;
  font-size:13px;
}

/* RESPONSIVE */

@media(max-width:700px){
  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .card-grid,
  .npc-grid{
    grid-template-columns:1fr;
  }

  .inventory-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .map{
    height:530px;
  }
}

@media(min-width:850px){
  .bottom-nav{
    width:min(700px,100%);
    left:50%;
    right:auto;
    transform:translateX(-50%);
    border:1px solid var(--line);
    border-bottom:0;
    border-radius:18px 18px 0 0;
  }

  .modal-backdrop{
    align-items:center;
    padding:20px;
  }

  .modal{
    border-radius:24px;
    max-height:85vh;
  }
}
</style>
</head>

function normalize(data){
  const base = cloneDefault();

  if(data && typeof data === "object"){
    Object.keys(base).forEach(key=>{
      if(data[key] !== undefined){
        base[key] = data[key];
      }
    });
  }

  if(!base.inventory || typeof base.inventory !== "object"){
    base.inventory = {};
  }

  Object.keys(defaultGame.inventory).forEach(key=>{
    if(typeof base.inventory[key] !== "number"){
      base.inventory[key] = 0;
    }
  });

  if(!base.friendship || typeof base.friendship !== "object"){
    base.friendship = {};
  }

  if(!Array.isArray(base.logs)){
    base.logs = [];
  }

  base.cash = Number(base.cash) || 0;
  base.bank = Number(base.bank) || 0;
  base.health = Math.max(0,Math.min(100,Number(base.health) || 0));
  base.energy = Math.max(0,Math.min(100,Number(base.energy) || 0));
  base.mood = Math.max(0,Math.min(100,Number(base.mood) || 0));
  base.reputation = Math.max(0,Math.min(100,Number(base.reputation) || 0));
  base.education = Math.max(0,Number(base.education) || 0);

  if(!base.location){
    base.location = "home";
  }

  if(base.version < 33){
    base.version = 33;
  }

  return base;
}

function storageKey(){
  return currentUser
    ? "kadunaLifeV33_" + currentUser.id
    : "kadunaLifeV33_guest";
}

function saveGame(){
  try{
    localStorage.setItem(storageKey(),JSON.stringify(game));
  }catch(e){
    console.warn("Could not save game",e);
  }
}

function loadGame(){
  if(!currentUser){
    game = normalize(game);
    return;
  }

  let raw = localStorage.getItem(storageKey());

  /* V32 migration */
  if(!raw){
    const old = localStorage.getItem("kadunaLifeV32_" + currentUser.id);
    if(old){
      raw = old;
    }
  }

  if(raw){
    try{
      game = normalize(JSON.parse(raw));
    }catch(e){
      game = cloneDefault();
    }
  }else{
    game = cloneDefault();
  }
}

function money(value){
  return "₦" + Number(value || 0).toLocaleString("en-NG");
}

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getLocation(id){
  return locations.find(x=>x.id===id);
}

function getNPC(id){
  return npcs.find(x=>x.id===id);
}

function getFriendship(id){
  return Number(game.friendship?.[id] || 0);
}

function setFriendship(id,value){
  if(!game.friendship){
    game.friendship = {};
  }

  game.friendship[id] = clamp(Number(value)||0,0,100);
}

function addLog(message){
  game.logs.unshift({
    day:game.day,
    message
  });

  if(game.logs.length > 30){
    game.logs.length = 30;
  }

  saveGame();
}

function toast(message){
  toastEl.textContent = message;
  toastEl.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    toastEl.classList.remove("show");
  },2200);
}

function changeStats(changes){
  Object.keys(changes).forEach(key=>{
    if(typeof game[key] !== "number") return;

    const limits = {
      health:[0,100],
      energy:[0,100],
      mood:[0,100],
      reputation:[0,100],
      education:[0,999]
    };

    if(limits[key]){
      game[key] = clamp(
        game[key] + Number(changes[key]),
        limits[key][0],
        limits[key][1]
      );
    }else{
      game[key] += Number(changes[key]);
    }
  });

  saveGame();
}

async function handleAuth(event){
  event.preventDefault();

  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  const message = document.getElementById("authMessage");

  message.textContent = "Please wait...";

  try{
    let result;

    if(authMode==="signup"){
      result = await supabaseClient.auth.signUp({
        email,
        password
      });
    }else{
      result = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });
    }

    if(result.error){
      throw result.error;
    }

    if(authMode==="signup"){
      if(result.data.session){
        currentUser = result.data.user;
        startGame();
      }else{
        message.textContent =
          "Account created. Check your email to confirm your account, then login.";
      }
    }else{
      currentUser = result.data.user;
      startGame();
    }

  }catch(error){
    console.error(error);
    message.textContent = error.message || "Something went wrong.";
  }
}

async function logout(){
  try{
    await supabaseClient.auth.signOut();
  }catch(e){
    console.warn(e);
  }

  currentUser = null;
  game = cloneDefault();
  renderAuth();
}

   ========================================================= */

async function startGame(){
  loadGame();

  if(!game.createdAt){
    game.createdAt = new Date().toISOString();
    saveGame();
  }

  await loadProfile();

  if(!game.name){
    showCharacterCreation();
  }else{
    renderGame();
  }
}

async function loadProfile(){
  if(!currentUser) return;

  try{
    const {data,error} = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

    if(error){
      console.warn("Profile read:",error);
      return;
    }

    if(data){
      if(data.name && !game.name){
        game.name = data.name;
      }

      if(data.age && !game.age){
        game.age = data.age;
      }

      if(data.gender && (!game.gender || game.gender==="Other")){
        game.gender = data.gender;
      }
    }
  }catch(e){
    console.warn(e);
  }
}

async function saveProfile(){
  if(!currentUser) return;

  try{
    const profile = {
      id:currentUser.id,
      name:game.name,
      age:game.age,
      gender:game.gender
    };

    const {error} = await supabaseClient
      .from("profiles")
      .upsert(profile);

    if(error){
      console.warn("Profile save:",error);
    }
  }catch(e){
    console.warn(e);
  }
}

    game.education = 10;

  const lines = [
    `You and ${npc.name} talked about life in Kaduna.`,
    `${npc.name} told you about their work.`,
    `You had a friendly conversation with ${npc.name}.`,
    `${npc.name} shared a funny story with you.`,

  changeStats({

  openNPCModal(npc,line);

/* =========================================================
   LOCATION ACTIONS
   ========================================================= */

function locationAction(action){

  switch(action){

    case "sleep":

      if(game.energy >= 95){
        toast("You're already full of energy.");
        return;
      }

      game.energy = 100;
      game.health = clamp(game.health + 8,0,100);
      game.mood = clamp(game.mood + 5,0,100);

      advanceDay();

      addLog("You slept at home and started a new day feeling refreshed.");

      closeModal();
      renderPage();

      toast("Good morning! ☀️");
      break;


    case "rest":

      if(game.energy >= 90){
        toast("You don't need much rest right now.");
        return;
      }

      game.energy = clamp(game.energy + 20,0,100);
      game.mood = clamp(game.mood + 3,0,100);

      addLog("You rested at home.");

      saveGame();
      closeModal();
      renderPage();

      toast("+20 energy ⚡");
      break;


    case "deposit":
      bankDeposit();
      break;


    case "withdraw":
      bankWithdraw();
      break;


    case "hospital":

      if(game.cash < 5000){
        toast("You need ₦5,000.");
        return;
      }

      if(game.health >= 100){
        toast("Your health is already full.");
        return;
      }

      game.cash -= 5000;
      game.health = 100;

      addLog("You received treatment at the hospital.");

      saveGame();

      openLocationModal(getLocation("hospital"));
      renderPage();

      toast("Health restored ❤️");
      break;


    case "study":

      if(game.cash < 2000){
        toast("You need ₦2,000.");
        return;
      }

      if(game.energy < 15){
        toast("You need at least 15 energy.");
        return;
      }

      game.cash -= 2000;
      game.energy -= 15;
      game.education += 5;
      game.mood = clamp(game.mood + 1,0,100);
      game.lastStudyDay = game.day;

      addLog("You studied at Kaduna University and improved your education.");

      saveGame();

      openLocationModal(getLocation("university"));
      renderPage();

      toast("+5 education 📚");
      break;


    case "restaurant":

      if(game.cash < 2000){
        toast("You need ₦2,000.");
        return;
      }

      game.cash -= 2000;
      game.energy = clamp(game.energy + 30,0,100);
      game.mood = clamp(game.mood + 4,0,100);
      game.lastMealDay = game.day;

      addLog("You had a meal at Northern Bites.");

      saveGame();

      openLocationModal(getLocation("restaurant"));
      renderPage();

      toast("+30 energy 🍽️");
      break;


    case "park":

      game.energy = clamp(game.energy + 10,0,100);
      game.mood = clamp(game.mood + 12,0,100);

      addLog("You relaxed at Kaduna Park.");

      saveGame();

      openLocationModal(getLocation("park"));
      renderPage();

      toast("You feel better 🌳");
      break;


    case "work":

      workToday();
      break;


    case "bike":

      if(game.transport==="Bike"){
        toast("You already have a bike.");
        return;
      }

      if(game.cash < 120000){
        toast("You need ₦120,000.");
        return;
      }

      game.cash -= 120000;
      game.transport = "Bike";

      addLog("You bought a bike.");

      saveGame();

      openLocationModal(getLocation("mechanic"));
      renderPage();

      toast("Bike purchased 🏍️");
      break;


    case "car":

      if(game.transport==="Car"){
        toast("You already have a car.");
        return;
      }

      if(game.cash < 1500000){
        toast("You need ₦1,500,000.");
        return;
      }

      game.cash -= 1500000;
      game.transport = "Car";

      addLog("You bought a car.");

      saveGame();

      openLocationModal(getLocation("mechanic"));
      renderPage();

      toast("Car purchased 🚗");
      break;


    case "service":

      if(game.cash < 5000){
        toast("You need ₦5,000.");
        return;
      }

      game.cash -= 5000;
      game.health = clamp(game.health + 1,0,100);

      addLog("You serviced your transport.");

      saveGame();

      openLocationModal(getLocation("mechanic"));
      renderPage();

      toast("Transport serviced 🔧");
      break;
  }
}

/* =========================================================
   BANK
   ========================================================= */

function bankDeposit(){

  const input = document.getElementById("bankAmount");
  const amount = Number(input?.value);

  if(!amount || amount <= 0){
    toast("Enter a valid amount.");
    return;
  }

  if(amount > game.cash){
    toast("You don't have enough cash.");
    return;
  }

  game.cash -= amount;
  game.bank += amount;

  addLog(`You deposited ${money(amount)} into your bank account.`);

  saveGame();

  openLocationModal(getLocation("bank"));
  renderPage();

  toast(`${money(amount)} deposited 🏦`);
}

function bankWithdraw(){

  const input = document.getElementById("bankAmount");
  const amount = Number(input?.value);

  if(!amount || amount <= 0){
    toast("Enter a valid amount.");
    return;
  }

  if(amount > game.bank){
    toast("You don't have enough in the bank.");
    return;
  }

  game.bank -= amount;
  game.cash += amount;

  addLog(`You withdrew ${money(amount)} from your bank account.`);

  saveGame();

  openLocationModal(getLocation("bank"));
  renderPage();

  toast(`${money(amount)} withdrawn 💵`);
}

/* =========================================================
   WORK
   ========================================================= */

function workToday(){

  if(game.career==="Unemployed"){
    toast("Choose a career first.");
    return;
  }

  if(game.lastWorkDay===game.day){
    toast("You've already worked today.");
    return;
  }

  if(game.energy < 25){
    toast("You need at least 25 energy to work.");
    return;
  }

  const earned = Number(game.salary);

  game.cash += earned;
  game.energy = clamp(game.energy - 25,0,100);
  game.mood = clamp(game.mood - 2,0,100);
  game.reputation = clamp(game.reputation + 2,0,100);
  game.lastWorkDay = game.day;

  addLog(`You worked as a ${game.career} and earned ${money(earned)}.`);

  saveGame();

  openLocationModal(getLocation("work"));
  renderPage();

  toast(`You earned ${money(earned)} 💰`);
}

function chooseCareer(id){

  const career = careers.find(x=>x.id===id);

  if(!career){
    return;
  }

  if(game.education < career.requirement){
    toast(`You need ${career.requirement} education.`);
    return;
  }

  game.career = career.name;
  game.salary = career.salary;

  addLog(`You started working as a ${career.name}.`);

  saveGame();

  openLocationModal(getLocation("work"));
  renderPage();

  toast(`Career selected: ${career.name} 💼`);
}

/* =========================================================
   TRANSPORT
   ========================================================= */

function chooseTransport(type){

  if(type==="Keke"){

    if(game.cash < 800){
      toast("You need ₦800.");
      return;
    }

    game.cash -= 800;
  }

  if(type==="Bike" && game.transport!=="Bike"){
    toast("You need to own a bike first.");
    return;
  }

  if(type==="Car" && game.transport!=="Car"){
    toast("You need to own a car first.");
    return;
  }

  game.transport = type;

  addLog(`You chose ${type} as your transport.`);

  saveGame();

  openLocationModal(getLocation("transport"));
  renderPage();

  toast(`${type} selected 🚦`);
}

/* =========================================================
   SHOP
   ========================================================= */

function buyItem(id){

  const item = shopItems.find(x=>x.id===id);

  if(!item){
    return;
  }

  if(game.cash < item.price){
    toast("Not enough cash.");
    return;
  }

  game.cash -= item.price;

  if(typeof game.inventory[id] !== "number"){
    game.inventory[id] = 0;
  }

  game.inventory[id]++;

  addLog(`You bought ${item.name} for ${money(item.price)}.`);

  saveGame();

  openLocationModal(getLocation("supermarket"));
  renderPage();

  toast(`${item.name} added to your bag 🛒`);
}

/* =========================================================
   INVENTORY USE
   ========================================================= */

function useInventoryItem(id){

  const count = Number(game.inventory[id] || 0);

  if(count <= 0){
    toast("You don't have this item.");
    return;
  }

  if(id==="water"){
    game.energy = clamp(game.energy + 5,0,100);
    game.inventory.water--;
    addLog("You drank some water.");
    toast("+5 energy 💧");
  }

  if(id==="snack"){
    game.energy = clamp(game.energy + 10,0,100);
    game.inventory.snack--;
    addLog("You ate a snack.");
    toast("+10 energy 🍪");
  }

  if(id==="meal"){
    game.energy = clamp(game.energy + 20,0,100);
    game.mood = clamp(game.mood + 2,0,100);
    game.inventory.meal--;
    addLog("You ate a packed meal.");
    toast("+20 energy 🍱");
  }

  if(id==="book"){
    game.education += 4;
    game.inventory.book--;
    game.energy = clamp(game.energy - 5,0,100);
    addLog("You studied using your book.");
    toast("+4 education 📚");
  }

  if(id==="clothes"){
    game.mood = clamp(game.mood + 5,0,100);
    game.reputation = clamp(game.reputation + 1,0,100);
    game.inventory.clothes--;
    addLog("You wore your new clothes.");
    toast("+5 mood 👕");
  }

  saveGame();
  renderPage();
}

/* =========================================================
   DAY SYSTEM
   ========================================================= */

function advanceDay(){

  game.day++;

  game.energy = 100;

  game.mood = clamp(game.mood + 2,0,100);

  if(game.health < 100){
    game.health = clamp(game.health + 4,0,100);
  }

  game.lastWorkDay = 0;
  game.lastStudyDay = 0;
  game.lastMealDay = 0;
  game.lastRestDay = 0;

  safeLifeEvent();

  saveGame();
}

function endDay(){

  advanceDay();

  game.location = "home";
  game.insideLocation = null;

  addLog("You ended the day and went home.");

  saveGame();

  renderPage();

  toast(`Day ${game.day} begins ☀️`);
}

    {
      text:"You organized your schedule and became more productive.",
      changes:{energy:3,reputation:2}
    }

  ];

  const event = events[Math.floor(Math.random()*events.length)];

  changeStats(event.changes);

  addLog(event.text);
}

/* =========================================================
   MOVEMENT
   ========================================================= */

function randomMove(){

  const choices = locations.filter(x=>x.id!==game.location);

  const destination =
    choices[Math.floor(Math.random()*choices.length)];

  game.location = destination.id;
  game.insideLocation = null;

  saveGame();

  renderPage();

  toast(`You travelled to ${destination.name}. 🚶`);
}

/* =========================================================
   MODAL
   ========================================================= */

function closeModal(){
  modalRoot.innerHTML = "";
}

/* =========================================================
   EVENT HANDLING
   ========================================================= */

document.addEventListener("click",async(event)=>{

  const target = event.target.closest("button");

  if(!target){
    return;
  }

  const page = target.dataset.page;

  if(page){
    activePage = page;
    closeModal();
    renderGame();
    return;
  }

  const authTab = target.dataset.authTab;

  if(authTab){
    authMode = authTab;
    renderAuth();
    return;
  }

  const action = target.dataset.action;

  if(action==="logout"){
    await logout();
    return;
  }

  if(action==="closeModal"){
    closeModal();
    return;
  }

  if(action==="leaveLocation"){
    leaveLocation();
    return;
  }

  if(action==="save"){
    saveGame();
    toast("Game saved 💾");
    return;
  }

  if(action==="endDay"){
    closeModal();
    endDay();
    return;
  }

  if(action==="randomMove"){
    randomMove();
    return;
  }

  const locationId = target.dataset.location;

  if(locationId){
    enterLocation(locationId);
    return;
  }

  const npcId = target.dataset.npc;

  if(npcId){
    talkToNPC(npcId);
    return;
  }

  const locationAction = target.dataset.locationAction;

  if(locationAction){
    locationActionHandler(locationAction);
    return;
  }

  const careerId = target.dataset.career;

  if(careerId){
    chooseCareer(careerId);
    return;
  }

  const transport = target.dataset.transport;

  if(transport){
    chooseTransport(transport);
    return;
  }

  const buyId = target.dataset.buy;

  if(buyId){
    buyItem(buyId);
    return;
  }

  const inventoryUse = target.dataset.inventoryUse;

  if(inventoryUse){
    useInventoryItem(inventoryUse);
    return;
  }

});

function locationActionHandler(action){
  locationAction(action);
}

/* =========================================================
   SUPABASE SESSION
   ========================================================= */

async function init(){

  try{

    const {
      data:{
        session
      }
    } = await supabaseClient.auth.getSession();

    if(session){

      currentUser = session.user;

      startGame();

    }else{

      renderAuth();

    }

    supabaseClient.auth.onAuthStateChange(
      (event,session)=>{

        if(session && !currentUser){

          currentUser = session.user;

          startGame();

        }

      }
    );

  }catch(error){

    console.error(error);

    renderAuth();

  }
}

init();

/* =========================================================
   AUTO SAVE
   ========================================================= */

setInterval(()=>{

  if(currentUser && game.name){
    saveGame();
  }

},15000);

/* =========================================================
   SMALL WORLD TICK
   ========================================================= */

setInterval(()=>{

  if(!currentUser || !game.name){
    return;
  }

  /*
    The city continues to feel alive without forcing
    dangerous or gambling mechanics on the player.
  */

  if(activePage==="map" && !game.insideLocation){

    const marker = document.getElementById("playerMarker");

    if(marker){

      const loc = getLocation(game.location);

      if(loc){

        marker.style.left = loc.x + "%";
        marker.style.top = loc.y + "%";

      }

    }

  }

},4000);

</script>
