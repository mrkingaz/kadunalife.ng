<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kaduna Life — V34</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================
   AUTH SCREEN
========================= */

#authScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(37,99,235,.35),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(16,185,129,.22),transparent 35%),
    linear-gradient(135deg,#07111f,#0f1d32 55%,#06111c);
}

.authBox{
  width:min(440px,100%);
  max-height:92vh;
  overflow:auto;
  background:rgba(13,25,43,.95);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:26px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
  font-size:34px;
  font-weight:900;
  text-align:center;
  margin-bottom:5px;
}

.logo span{
  color:#4ade80;
}

.subtitle{
  text-align:center;
  color:#9fb0c7;
  margin-bottom:24px;
}

.authTabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.authTabs button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:12px;
  background:#182940;
  color:#aebdd0;
}

.authTabs button.active{
  background:#2563eb;
  color:#fff;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  color:#9fb0c7;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  border:1px solid #30435d;
  background:#0a1728;
  color:#fff;
  padding:13px;
  border-radius:12px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#3b82f6;
}

.primaryBtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
  font-weight:800;
  margin-top:5px;
}

.secondaryBtn{
  width:100%;
  padding:12px;
  border:1px solid #30435d;
  border-radius:12px;
  background:#101f33;
  color:#fff;
  margin-top:9px;
}

.message{
  min-height:20px;
  margin:10px 0;
  font-size:13px;
  text-align:center;
  color:#fbbf24;
}

/* =========================
   GAME SHELL
========================= */

#gameScreen{
  position:fixed;
  inset:0;
  background:#172a1c;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:30;
  padding:
    calc(8px + env(safe-area-inset-top))
    10px
    8px
    10px;
  pointer-events:none;
}

.hudTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.hudCard{
  background:rgba(7,17,31,.86);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  border-radius:14px;
  padding:8px 11px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.playerName{
  font-weight:800;
  font-size:14px;
}

.dayText{
  color:#aebdd0;
  font-size:11px;
  margin-top:2px;
}

.money{
  font-weight:900;
  color:#4ade80;
  font-size:14px;
}

.stats{
  margin-top:7px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.stat{
  font-size:10px;
  padding:5px 7px;
  border-radius:8px;
  background:rgba(9,22,38,.88);
  border:1px solid rgba(255,255,255,.08);
}

#menuBtn{
  pointer-events:auto;
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  background:rgba(7,17,31,.9);
  color:#fff;
  font-size:20px;
}

/* =========================
   LOCATION PROMPT
========================= */

#locationPrompt{
  position:absolute;
  left:50%;
  bottom:135px;
  transform:translateX(-50%);
  z-index:40;
  min-width:220px;
  max-width:90%;
  text-align:center;
  background:rgba(7,17,31,.93);
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  padding:11px 14px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  pointer-events:none;
}

#locationPrompt strong{
  display:block;
  font-size:14px;
}

#locationPrompt span{
  display:block;
  color:#aebdd0;
  font-size:11px;
  margin-top:3px;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:absolute;
  inset:0;
  z-index:35;
  pointer-events:none;
}

.dpad{
  position:absolute;
  left:18px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:150px;
  height:150px;
  pointer-events:auto;
}

.controlBtn{
  position:absolute;
  width:50px;
  height:50px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(7,17,31,.82);
  color:#fff;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  touch-action:none;
  box-shadow:0 8px 20px rgba(0,0,0,.28);
}

.controlBtn:active{
  background:#2563eb;
  transform:scale(.95);
}

.up{
  left:50px;
  top:0;
}

.down{
  left:50px;
  bottom:0;
}

.left{
  left:0;
  top:50px;
}

.right{
  right:0;
  top:50px;
}

.actionPad{
  position:absolute;
  right:18px;
  bottom:calc(28px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:9px;
  pointer-events:auto;
}

.actionBtn{
  min-width:92px;
  padding:12px 15px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  background:rgba(7,17,31,.85);
  color:#fff;
  font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,.28);
}

.actionBtn:active{
  transform:scale(.96);
  background:#2563eb;
}

/* =========================
   DESKTOP HELP
========================= */

#keyboardHint{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:25;
  background:rgba(7,17,31,.7);
  border:1px solid rgba(255,255,255,.1);
  padding:6px 10px;
  border-radius:9px;
  color:#aebdd0;
  font-size:11px;
  pointer-events:none;
}

/* =========================
   PANELS
========================= */

#sidePanel{
  position:absolute;
  z-index:100;
  top:0;
  right:0;
  width:min(390px,92vw);
  height:100%;
  background:#0b1727;
  border-left:1px solid #263952;
  transform:translateX(100%);
  transition:transform .25s ease;
  overflow:auto;
  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    calc(18px + env(safe-area-inset-bottom))
    18px;
}

#sidePanel.open{
  transform:translateX(0);
}

.panelHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.panelHeader h2{
  margin:0;
}

.closeBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#192b42;
  color:#fff;
  font-size:20px;
}

.menuGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.menuItem{
  min-height:90px;
  border:1px solid #263952;
  background:#101f33;
  color:#fff;
  border-radius:15px;
  padding:13px;
  text-align:left;
}

.menuItem .icon{
  font-size:24px;
}

.menuItem strong{
  display:block;
  margin-top:6px;
}

.menuItem small{
  color:#91a3b9;
}

/* =========================
   MODAL
========================= */

#modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.55);
}

#modal.show{
  display:flex;
}

.modalBox{
  width:min(500px,100%);
  max-height:88vh;
  overflow:auto;
  background:#0c1a2c;
  border:1px solid #2b405b;
  border-radius:20px;
  padding:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.modalHeader h2{
  margin:0;
}

.modalClose{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#1b2d45;
  color:#fff;
}

.actionList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.bigAction{
  width:100%;
  padding:14px;
  text-align:left;
  border:1px solid #2a3e59;
  border-radius:13px;
  background:#112238;
  color:#fff;
}

.bigAction:hover{
  background:#172d48;
}

.bigAction strong{
  display:block;
}

.bigAction small{
  color:#91a3b9;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#10253b;
  color:#b6c7da;
  margin-bottom:12px;
  line-height:1.5;
}

/* =========================
   PROFILE
========================= */

.profileCard{
  background:#102238;
  border:1px solid #293e58;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.profileRow{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.profileRow:last-child{
  border-bottom:0;
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width:800px){
  .dpad{
    left:25px;
    bottom:25px;
  }

  .actionPad{
    right:25px;
    bottom:25px;
  }

  #keyboardHint{
    display:block;
  }
}

@media (max-width:600px){
  #keyboardHint{
    display:none;
  }

  #locationPrompt{
    bottom:170px;
  }

  .hudCard{
    padding:7px 9px;
  }
}
</style>
</head>

<body>

     AUTH
========================= -->

<section id="authScreen">

const supabaseClient =

/* =========================
   DOM

const authScreen =

const gameScreen =

const authForm =

const authMessage =
  document.getElementById("authMessage");

const loginTab =

const signupTab =

const locationPrompt =

  document.getElementById("promptTitle");

const promptText =
  document.getElementById("promptText");


/* =========================
   AUTH MODE
========================= */

let authMode = "login";

loginTab.onclick = () => {
  authMode = "login";

  loginTab.classList.add("active");
  signupTab.classList.remove("active");

  signupFields.classList.add("hidden");

  authButton.textContent = "Login";
  authMessage.textContent = "";
};

signupTab.onclick = () => {
  authMode = "signup";

  signupTab.classList.add("active");
  loginTab.classList.remove("active");

  signupFields.classList.remove("hidden");

  authButton.textContent = "Create Account";
  authMessage.textContent = "";
};


/* =========================
   DEFAULT GAME STATE
========================= */

const DEFAULT_GAME = {

  version: 34,

  character: {
    name: "",
    age: 18,
    background: "student"
  },

  cash: 50000,
  bank: 100000,

  health: 100,
  energy: 100,
  mood: 75,
  reputation: 0,

  day: 1,

  career: {
    name: "Unemployed",
    salary: 0
  },

  home: "Family Home",

  transport: "Walking",

  inventory: [],

  friendship: {},

  achievements: [],

  player: {
    x: 800,
    y: 520
  }

};


/* =========================
   GAME STATE
========================= */

let game =
  structuredClone(DEFAULT_GAME);

let currentUser = null;

let running = false;

let lastFrame = 0;

let nearbyLocation = null;

let nearNPC = null;

let currentMapTime = 0;


/* =========================
   INPUT
========================= */

const keys = {};

let touchDirections = {
  up:false,
  down:false,
  left:false,
  right:false
};

let runningFast = false;

document.addEventListener("keydown", e => {

  const key =
    e.key.length === 1
      ? e.key.toLowerCase()
      : e.key;

  keys[key] = true;

  if([
    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight",
    " "
  ].includes(e.key)){
    e.preventDefault();
  }

  if(
    (e.key === "Enter" || e.key === "e" || e.key === "E") &&
    running
  ){
    interact();
  }

});

document.addEventListener("keyup", e => {

  const key =
    e.key.length === 1
      ? e.key.toLowerCase()
      : e.key;

  keys[key] = false;

});


/* =========================
   MOBILE CONTROLS
========================= */

document
  .querySelectorAll(".controlBtn")
  .forEach(btn => {

    const key = btn.dataset.key;

    const directionMap = {
      ArrowUp:"up",
      ArrowDown:"down",
      ArrowLeft:"left",
      ArrowRight:"right"
    };

    const direction =
      directionMap[key];

    const start = e => {
      e.preventDefault();
      touchDirections[direction] = true;
    };

    const end = e => {
      e.preventDefault();
      touchDirections[direction] = false;
    };

    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointercancel", end);
    btn.addEventListener("pointerleave", end);

  });


document
  .getElementById("runBtn")
  .addEventListener("pointerdown", e => {
    e.preventDefault();
    runningFast = true;
  });

document
  .getElementById("runBtn")
  .addEventListener("pointerup", e => {
    e.preventDefault();
    runningFast = false;
  });

document
  .getElementById("runBtn")
  .addEventListener("pointercancel", () => {
    runningFast = false;
  });


document
  .getElementById("interactBtn")
  .onclick = () => interact();


/* =========================
   WORLD SIZE
========================= */

const WORLD = {

  height: 1500
};

========================= */

  },

  {

    x:730,

    w:280,
    h:170,
    color:"#285ea8",
    description:"Manage your cash and bank account.",
    actions:["bank"]
  },

  {

/* =========================
   DRAW HELPERS
========================= */

function roundedRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  const radius =
    Math.min(r,w/2,h/2);

  ctx.beginPath();

  ctx.moveTo(x+radius,y);

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    radius
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    radius
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    radius
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    radius
  );

  ctx.closePath();

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld(){

  ctx.clearRect(
    0,
    0,
    viewport.width,
    viewport.height
  );

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  /* GRASS */

  ctx.fillStyle="#477b45";

  ctx.fillRect(
    0,
    0,
    WORLD.width,
    WORLD.height
  );


  /* SUBTLE GRID */

  ctx.strokeStyle="rgba(255,255,255,.025)";
  ctx.lineWidth=1;

  for(
    let x=0;
    x<WORLD.width;
    x+=50
  ){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,WORLD.height);
    ctx.stroke();

  }

  for(
    let y=0;
    y<WORLD.height;
    y+=50
  ){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(WORLD.width,y);
    ctx.stroke();

  }


  /* ROADS */

  roads.forEach(road => {

    ctx.fillStyle="#454c54";

    ctx.fillRect(
      road.x,
      road.y,
      road.w,
      road.h
    );

    ctx.strokeStyle="rgba(255,255,255,.13)";
    ctx.lineWidth=2;

    if(road.w > road.h){

      const mid =
        road.y + road.h/2;

      ctx.setLineDash([28,20]);

      ctx.beginPath();
      ctx.moveTo(
        road.x,
        mid
      );
      ctx.lineTo(
        road.x+road.w,
        mid
      );
      ctx.stroke();

    }else{

      const mid =
        road.x + road.w/2;

      ctx.setLineDash([28,20]);

      ctx.beginPath();
      ctx.moveTo(
        mid,
        road.y
      );
      ctx.lineTo(
        mid,
        road.y+road.h
      );
      ctx.stroke();

    }

    ctx.setLineDash([]);

  });


  /* BUILDINGS */

  locations.forEach(location => {

    ctx.fillStyle="rgba(0,0,0,.18)";

    roundedRect(
      ctx,
      location.x+7,
      location.y+9,
      location.w,
      location.h,
      18
    );

    ctx.fill();

    ctx.fillStyle =
      location.color;

    roundedRect(
      ctx,
      location.x,
      location.y,
      location.w,
      location.h,
      18
    );

    ctx.fill();

    ctx.strokeStyle=
      "rgba(255,255,255,.16)";

    ctx.lineWidth=2;

    roundedRect(
      ctx,
      location.x,
      location.y,
      location.w,
      location.h,
      18
    );

    ctx.stroke();


    /* WINDOWS */

    ctx.fillStyle=
      "rgba(210,235,255,.8)";

    const cols =
      Math.max(
        2,
        Math.floor(location.w/80)
      );

    const rows =
      Math.max(
        2,
        Math.floor(location.h/65)
      );

    for(let r=0;r<rows;r++){

      for(let c=0;c<cols;c++){

        const wx =
          location.x+25+c*65;

        const wy =
          location.y+65+r*55;

        if(
          wx+22 < location.x+location.w-10 &&
          wy+18 < location.y+location.h-15
        ){

          ctx.fillRect(
            wx,
            wy,
            22,
            18
          );

        }

      }

    }


    /* BUILDING LABEL */

    ctx.font=
      "bold 16px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.fillText(
      location.emoji,
      location.x+location.w/2,
      location.y+34
    );

    ctx.font=
      "bold 13px Arial";

    ctx.fillText(
      location.name,
      location.x+location.w/2,
      location.y+54
    );

  });


  /* TREES */

  trees.forEach(tree => {

    ctx.fillStyle="rgba(0,0,0,.16)";

    ctx.beginPath();

    ctx.arc(
      tree.x+4,
      tree.y+7,
      tree.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#245c31";

    ctx.beginPath();

    ctx.arc(
      tree.x,
      tree.y,
      tree.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#4e9a50";

    ctx.beginPath();

    ctx.arc(
      tree.x-5,
      tree.y-6,
      tree.r*.55,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  /* NPCs */

  npcs.forEach(npc => {

    ctx.fillStyle="rgba(0,0,0,.2)";

    ctx.beginPath();

    ctx.ellipse(
      npc.x+3,
      npc.y+13,
      12,
      5,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle=npc.color;

    ctx.beginPath();

    ctx.arc(
      npc.x,
      npc.y,
      12,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=
      "rgba(255,255,255,.65)";

    ctx.lineWidth=2;

    ctx.stroke();


    ctx.font="15px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      npc.emoji,
      npc.x,
      npc.y+5
    );

    ctx.font="10px Arial";

    ctx.fillStyle="#fff";

    ctx.fillText(
      npc.name,
      npc.x,
      npc.y-18
    );

  });


  /* PLAYER */

  drawPlayer();


  ctx.restore();

}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

  const p =
    game.player;

  /* Shadow */

  ctx.fillStyle=
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y+17,
    16,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Body */

  ctx.fillStyle="#2563eb";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    15,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Head */

  ctx.fillStyle="#f1c27d";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-17,
    10,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Hair */

  ctx.fillStyle="#21180f";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-20,
    10,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* Direction indicator */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y+1,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Name */

  ctx.font="bold 11px Arial";

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.fillText(
    game.character.name || "You",
    p.x,
    p.y+38
  );

}


/* =========================
   COLLISION
========================= */

function circleRectCollision(
  cx,
  cy,
  radius,
  rect
){

  const closestX =
    Math.max(
      rect.x,
      Math.min(
        cx,
        rect.x+rect.w
      )
    );

  const closestY =
    Math.max(
      rect.y,
      Math.min(
        cy,
        rect.y+rect.h
      )
    );

  const dx =
    cx-closestX;

  const dy =
    cy-closestY;

  return (
    dx*dx+
    dy*dy
  ) <
  radius*radius;

}


function canMoveTo(x,y){

  const radius=16;

  /* WORLD BORDER */

  if(
    x<radius ||
    y<radius ||
    x>WORLD.width-radius ||
    y>WORLD.height-radius
  ){

    return false;

  }


  /* BUILDINGS */

  for(
    const location of locations
  ){

    if(
      circleRectCollision(
        x,
        y,
        radius,
        {
          x:location.x-8,
          y:location.y-8,
          w:location.w+16,
          h:location.h+16
        }
      )
    ){

      return false;

    }

  }


  return true;

}


/* =========================
   MOVEMENT
========================= */

function getMovement(){

  let dx=0;
  let dy=0;

  if(
    keys["ArrowUp"] ||
    keys["w"] ||
    touchDirections.up
  ){

    dy-=1;

  }

  if(
    keys["ArrowDown"] ||
    keys["s"] ||
    touchDirections.down
  ){

    dy+=1;

  }

  if(
    keys["ArrowLeft"] ||
    keys["a"] ||
    touchDirections.left
  ){

    dx-=1;

  }

  if(
    keys["ArrowRight"] ||
    keys["d"] ||
    touchDirections.right
  ){

    dx+=1;

  }

  if(dx!==0 || dy!==0){

    const length =
      Math.hypot(dx,dy);

    dx/=length;
    dy/=length;

  }

  return {
    dx,
    dy
  };

}


function updatePlayer(dt){

  const movement =
    getMovement();

  if(
    movement.dx===0 &&
    movement.dy===0
  ){

    return;

  }

  let speed =
    runningFast
      ? 240
      : 155;

  if(game.energy<=0){

    speed=90;

  }

  const moveX =
    movement.dx*speed*dt;

  const moveY =
    movement.dy*speed*dt;


  const nextX =
    game.player.x+moveX;

  const nextY =
    game.player.y+moveY;


  /* Separate-axis collision */

  if(
    canMoveTo(
      nextX,
      game.player.y
    )
  ){

    game.player.x=nextX;

  }

  if(
    canMoveTo(
      game.player.x,
      nextY
    )
  ){

    game.player.y=nextY;

  }


  /* Energy slowly drains while running */

  if(runningFast){

    game.energy =
      Math.max(
        0,
        game.energy-dt*1.8
      );

  }else{

    game.energy =
      Math.min(
        100,
        game.energy+dt*.25
      );

  }

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

  const targetX =
    game.player.x -
    viewport.width/2;

  const targetY =
    game.player.y -
    viewport.height/2;


  const maxX =
    Math.max(
      0,
      WORLD.width-viewport.width
    );

  const maxY =
    Math.max(
      0,
      WORLD.height-viewport.height
    );


  const clampedX =
    Math.max(
      0,
      Math.min(
        maxX,
        targetX
      )
    );

  const clampedY =
    Math.max(
      0,
      Math.min(
        maxY,
        targetY
      )
    );


  camera.x +=
    (clampedX-camera.x)*.12;

  camera.y +=
    (clampedY-camera.y)*.12;

}


/* =========================
   NPC MOVEMENT
========================= */

function updateNPCs(dt){

  npcs.forEach(npc => {

    npc.timer-=dt;

    if(npc.timer<=0){

      npc.timer =
        1.5+
        Math.random()*3;

      const direction =
        Math.floor(
          Math.random()*5
        );

      if(direction===0){
        npc.dx=1;
        npc.dy=0;
      }

      if(direction===1){
        npc.dx=-1;
        npc.dy=0;
      }

      if(direction===2){
        npc.dx=0;
        npc.dy=1;
      }

      if(direction===3){
        npc.dx=0;
        npc.dy=-1;
      }

      if(direction===4){
        npc.dx=0;
        npc.dy=0;
      }

    }

    const nx =
      npc.x+npc.dx*dt*28;

    const ny =
      npc.y+npc.dy*dt*28;

    if(
      nx>20 &&
      nx<WORLD.width-20
    ){

      npc.x=nx;

    }else{

      npc.dx*=-1;

    }

    if(
      ny>20 &&
      ny<WORLD.height-20
    ){

      npc.y=ny;

    }else{

      npc.dy*=-1;

    }

  });

}


/* =========================
   NEARBY DETECTION
========================= */

function distance(
  x1,
  y1,
  x2,
  y2
){

  return Math.hypot(
    x1-x2,
    y1-y2
  );

}


function updateNearby(){

  nearbyLocation=null;
  nearNPC=null;


  /* LOCATIONS */

  let closestLocationDistance=Infinity;

  locations.forEach(location => {

    const centerX =
      location.x+location.w/2;

    const centerY =
      location.y+location.h/2;

    const d =
      distance(
        game.player.x,
        game.player.y,
        centerX,
        centerY
      );

    if(
      d<115 &&
      d<closestLocationDistance
    ){

      closestLocationDistance=d;
      nearbyLocation=location;

    }

  });


  /* NPC */

  let closestNPCDistance=Infinity;

  npcs.forEach(npc => {

    const d =
      distance(
        game.player.x,
        game.player.y,
        npc.x,
        npc.y
      );

    if(
      d<75 &&
      d<closestNPCDistance
    ){

      closestNPCDistance=d;
      nearNPC=npc;

    }

  });


  if(nearNPC){

    locationPrompt.classList.remove(
      "hidden"
    );

    promptTitle.textContent =
      `${nearNPC.emoji} ${nearNPC.name}`;

    promptText.textContent =
      "Press ENTER to talk";

    return;

  }


  if(nearbyLocation){

    locationPrompt.classList.remove(
      "hidden"
    );

    promptTitle.textContent =
      `${nearbyLocation.emoji} ${nearbyLocation.name}`;

    promptText.textContent =
      "Press ENTER to enter";

    return;

  }


  locationPrompt.classList.add(
    "hidden"
  );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(timestamp){

  if(!running){

    return;

  }

  if(!lastFrame){

    lastFrame=timestamp;

  }

  let dt =
    (timestamp-lastFrame)/1000;

  lastFrame=timestamp;

  dt=Math.min(dt,.05);

  updatePlayer(dt);
  updateNPCs(dt);
  updateNearby();
  updateCamera();
  drawWorld();
  updateHUD();

  requestAnimationFrame(
    gameLoop
  );

}

/* =========================
   ACTIONS
========================= */

async function performAction(
  action
){

  if(action==="rest"){

    game.energy =
      Math.min(
        100,
        game.energy+35
      );

    game.mood =
      Math.min(
        100,
        game.mood+5
      );

    notify(
      "You rested and recovered some energy."
    );

  }


  if(action==="sleep"){

    advanceDay();

    notify(
      "You slept. A new day begins."
    );

  }


  if(action==="deposit"){

    const amount=10000;

    if(game.cash<amount){

      notify(
        "You don't have enough cash."
      );
      return;

    }

    game.cash-=amount;
    game.bank+=amount;

    notify(
      "₦10,000 deposited."
    );

  }


  if(action==="withdraw"){

    const amount=10000;

    if(game.bank<amount){

      notify(
        "You don't have enough money in the bank."
      );
      return;

    }

    game.bank-=amount;
    game.cash+=amount;

    notify(
      "₦10,000 withdrawn."
    );

  }


  if(action==="hospital"){

    const cost=5000;

    if(game.cash<cost){

      notify(
        "You need ₦5,000 for treatment."
      );
      return;

    }

    game.cash-=cost;

    game.health=
      Math.min(
        100,
        game.health+45
      );

    game.mood=
      Math.min(
        100,
        game.mood+3
      );

    notify(
      "Treatment complete. Health restored."
    );

  }


  if(action==="study"){

    if(game.energy<15){

      notify(
        "You're too tired to study. Rest first."
      );
      return;

    }

    game.energy-=15;

    game.reputation+=2;

    game.mood=
      Math.min(
        100,
        game.mood+2
      );

    notify(
      "You studied and improved your skills."
    );

  }


  if(action==="eat"){

    const cost=3000;

    if(game.cash<cost){

      notify(
        "You need ₦3,000 for a meal."
      );
      return;

    }

    game.cash-=cost;

    game.energy=
      Math.min(
        100,
        game.energy+25
      );

    game.mood=
      Math.min(
        100,
        game.mood+10
      );

    notify(
      "Nice meal. You feel better."
    );

  }


  if(action==="park"){

    game.mood=
      Math.min(
        100,
        game.mood+12
      );

    game.reputation+=1;

    notify(
      "You relaxed at the park."
    );

  }


  if(action==="career"){

    openCareerMenu();
    return;

  }


  if(action==="work"){

    workJob();
    return;

  }


  if(action==="market"){

    game.mood=
      Math.min(
        100,
        game.mood+3
      );

    notify(
      "You explored the market."
    );

  }


  if(action==="mechanic"){

    if(
      game.transport==="Walking"
    ){

      notify(
        "You don't currently have a vehicle."
      );

    }else{

      if(game.cash<5000){

        notify(
          "Vehicle service costs ₦5,000."
        );

      }else{

        game.cash-=5000;

        game.reputation+=1;

        notify(
          "Vehicle serviced."
        );

      }

    }

  }


  updateHUD();
  saveGame();

}

========================= */

const itemPrices = {

  Water:500,
  Snack:1000,
  Phone:80000

};


function buyItem(item){

  const price =
    itemPrices[item];

  if(
    typeof price!=="number"
  ){

    return;

  }

  if(game.cash<price){

    notify(
      "You don't have enough cash."
    );

    return;

  }

  game.cash-=price;

  game.inventory.push({
    name:item,
    quantity:1
  });

  notify(
    `${item} added to your inventory.`
  );

  updateHUD();

  saveGame();

}


/* =========================

function chooseTransport(
  transport
){

  if(
    transport==="Walking"
  ){

    game.transport="Walking";

    notify(
      "You are now walking."
    );

    closeModal();

    saveGame();

    return;

  }


  if(
    transport==="Bike"
  ){

    const price=100000;

    if(game.transport==="Bike"){

      notify(
        "You already have a bike."
      );
      return;

    }

    if(game.cash<price){

      notify(
        "You need ₦100,000."
      );
      return;

    }

    game.cash-=price;
    game.transport="Bike";

    notify(
      "You bought a bike."
    );

  }


  if(
    transport==="Car"
  ){

    const price=3000000;

    if(game.transport==="Car"){

      notify(
        "You already have a car."
      );
      return;

    }

    if(game.cash<price){

      notify(
        "You need ₦3,000,000."
      );
      return;

    }

    game.cash-=price;
    game.transport="Car";

    notify(
      "You bought a car."
    );

  }


  updateHUD();

  saveGame();

}

function npcInteraction(
  action,
  npcId
){

  const npc =
    npcs.find(
      n => n.id===npcId
    );

  if(!npc){

    return;

  }

  if(
    typeof game.friendship[npcId]!=="number"
  ){

    game.friendship[npcId]=0;

  }


  if(action==="talk"){

    game.friendship[npcId]+=3;

    game.mood=
      Math.min(
        100,
        game.mood+4
      );

    notify(
      `You had a friendly conversation with ${npc.name}.`
    );

  if(action==="hangout"){

    if(game.energy<10){

      notify(
        "You're too tired to hang out."
      );

      return;

    }

    game.friendship[npcId]+=7;

    game.energy-=10;

    game.mood=
      Math.min(
        100,
        game.mood+8
      );

    notify(
      `You hung out with ${npc.name}.`
    );

  updateHUD();

  saveGame();

  closeModal();

/* =========================
   DAY SYSTEM
========================= */

function advanceDay(){

  game.day++;

  game.energy=100;

  game.health=
    Math.min(
      100,
      game.health+8
    );

  game.mood=
    Math.min(
      100,
      game.mood+5
    );


  if(
    game.career.salary>0
  ){

    const dailyIncome =
      Math.floor(
        game.career.salary/30
      );

    game.bank+=dailyIncome;

  }


  safeLifeEvent();

  updateHUD();

  saveGame();

}


/* =========================
   SAFE RANDOM LIFE EVENTS
========================= */

function safeLifeEvent(){

  const events = [

    {
      text:"You helped someone in your neighborhood. Your reputation increased.",
      apply:()=>{
        game.reputation+=3;
      }
    },

    {
      text:"You had a productive day. Your mood improved.",
      apply:()=>{
        game.mood=
          Math.min(
            100,
            game.mood+8
          );
      }
    },

    {
      text:"You found a small paid task.",
      apply:()=>{
        game.cash+=5000;
      }
    },

    {
      text:"You took some time to rest and reset.",
      apply:()=>{
        game.energy=
          Math.min(
            100,
            game.energy+10
          );
      }
    }

  ];


  if(
    Math.random()<.45
  ){

    const event =
      events[
        Math.floor(
          Math.random()*events.length
        )
      ];

    event.apply();

    setTimeout(
      () => notify(event.text),
      250
    );

  }

}

/* =========================
   SAVE
========================= */

function storageKey(){

  if(!currentUser){

    return "kadunaLife_guest";

  }

  return (
    "kadunaLife_v34_"+currentUser.id
  );

}


function saveLocal(){

  try{

    localStorage.setItem(
      storageKey(),
      JSON.stringify(game)
    );

  }catch(error){

    console.warn(
      "Local save failed:",
      error
    );

  }

}


function loadLocal(){

  try{

    const saved =
      localStorage.getItem(
        storageKey()
      );

    if(!saved){

      return false;

    }

    const parsed =
      JSON.parse(saved);

    game =
      normalizeGame(parsed);

    return true;

  }catch(error){

    console.warn(
      "Local load failed:",
      error
    );

    return false;

  }

}


/* =========================
   NORMALIZE
========================= */

function normalizeGame(data){

  const result =
    structuredClone(
      DEFAULT_GAME
    );


  if(
    data &&
    typeof data==="object"
  ){

    Object.assign(
      result,
      data
    );

  }


  result.character =
    Object.assign(
      {},
      DEFAULT_GAME.character,
      data?.character||{}
    );


  result.career =
    Object.assign(
      {},
      DEFAULT_GAME.career,
      data?.career||{}
    );


  result.player =
    Object.assign(
      {},
      DEFAULT_GAME.player,
      data?.player||{}
    );


  if(
    !Array.isArray(
      result.inventory
    )
  ){

    result.inventory=[];

  }


  if(
    !result.friendship ||
    typeof result.friendship!=="object"
  ){

    result.friendship={};

  }


  if(
    !Array.isArray(
      result.achievements
    )
  ){

    result.achievements=[];

  }


  result.health =
    Number(result.health)||100;

  result.energy =
    Number(result.energy)||100;

  result.mood =
    Number(result.mood)||75;

  result.reputation =
    Number(result.reputation)||0;

  result.cash =
    Number(result.cash)||0;

  result.bank =
    Number(result.bank)||0;

  result.day =
    Number(result.day)||1;


  return result;

}


/* =========================
   SUPABASE PROFILE
========================= */

async function loadCloudProfile(){

  if(!currentUser){

    return;

  }


  try{

    const {data,error} =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if(error){

      console.warn(
        "Cloud profile load:",
        error.message
      );

      return;

    }


    if(data){

      /* Try common state columns */

      let cloudState =
        null;


      if(
        data.game_state
      ){

        cloudState =
          data.game_state;

      }else if(
        data.gamestate
      ){

        cloudState =
          data.gamestate;

      }else if(
        data.game
      ){

        cloudState =
          data.game;

      }


      if(
        typeof cloudState==="string"
      ){

        try{

          cloudState =
            JSON.parse(
              cloudState
            );

        }catch(e){

          cloudState=null;

        }

      }


      if(
        cloudState &&
        typeof cloudState==="object"
      ){

        game =
          normalizeGame(
            cloudState
          );

        saveLocal();

      }else{

        /* Existing profile may have
           character information. */

        if(data.name){

          game.character.name =
            data.name;

        }

        if(data.age){

          game.character.age =
            data.age;

        }

      }

    }

  }catch(error){

    console.warn(
      "Cloud load failed:",
      error
    );

  }

}


async function saveCloud(){

  if(!currentUser){

    return;

  }


  try{

    const payload = {

      id:currentUser.id,

      game_state:game

    };


    if(
      game.character.name
    ){

      payload.name =
        game.character.name;

    }


    if(
      game.character.age
    ){

      payload.age =
        game.character.age;

    }


    const {error} =
      await supabaseClient
        .from("profiles")
        .upsert(
          payload,
          {
            onConflict:"id"
          }
        );


    if(error){

      console.warn(
        "Cloud save:",
        error.message
      );

    }

  }catch(error){

    console.warn(
      "Cloud save failed:",
      error
    );

  }

}


async function saveGame(){

  saveLocal();

  await saveCloud();

}


/* =========================
   SAVE BUTTON
========================= */

document
  .getElementById("saveBtn")
  .onclick = async () => {

    await saveGame();

    notify(
      "Game saved."
    );

  };


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutBtn")
  .onclick = async () => {

    await saveGame();

    await supabaseClient.auth.signOut();

    currentUser=null;

    );

    authScreen.classList.remove(

/* =========================
   NOTIFICATION
========================= */

let notificationTimer=null;

function notify(message){

  const old =
    document.getElementById(
      "gameNotification"
    );

  if(old){

    old.remove();

  }


  const notification =
    document.createElement("div");

  notification.id=
    "gameNotification";

  notification.textContent=
    message;


  notification.style.position=
    "fixed";

  notification.style.left=
    "50%";

  notification.style.top=
    "50%";

  notification.style.transform=
    "translate(-50%,-50%)";

  notification.style.zIndex=
    "500";

  notification.style.background=
    "rgba(7,17,31,.96)";

  notification.style.border=
    "1px solid rgba(255,255,255,.15)";

  notification.style.borderRadius=
    "14px";

  notification.style.padding=
    "14px 18px";

  notification.style.maxWidth=
    "85vw";

  notification.style.textAlign=
    "center";

  notification.style.boxShadow=
    "0 20px 60px rgba(0,0,0,.5)";


  document.body.appendChild(
    notification
  );


  clearTimeout(
    notificationTimer
  );


  notificationTimer =
    setTimeout(
      () => {

        notification.remove();

      },
      2200
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   CHARACTER CREATION
========================= */

async function createCharacter(){

  const name =
    charNameInput.value.trim();

  const age =
    Number(
      charAgeInput.value
    );

  const background =
    charBackgroundInput.value;


  if(!name){

    throw new Error(
      "Enter a character name."
    );

  }


  if(
    age<18 ||
    age>50
  ){

    throw new Error(
      "Character age must be between 18 and 50."
    );

  }


  game =
    normalizeGame(
      DEFAULT_GAME
    );


  game.character = {

    name,

    age,

    background

  };


  /* Starting position */

  game.player = {

    x:800,

    y:520

  };


  game.cash=50000;
  game.bank=100000;


  saveLocal();

}


/* =========================
   AUTH
========================= */

authForm.addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    authMessage.textContent=
      "Please wait...";

    authButton.disabled=true;


    try{

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if(authMode==="login"){

        const {data,error} =
          await supabaseClient
            .auth
            .signInWithPassword({
              email,
              password
            });


        if(error){

          throw error;

        }


        currentUser =
          data.user;


        await startGame();


      }else{

        const {data,error} =
          await supabaseClient
            .auth
            .signUp({

              email,

              password

            });


        if(error){

          throw error;

        }


        if(!data.user){

          throw new Error(
            "Account could not be created."
          );

        }


        currentUser =
          data.user;


        try{

          await createCharacter();

        }catch(characterError){

          await supabaseClient
            .auth
            .signOut();

          throw characterError;

        }


        /* Email confirmation is enabled
           in the user's Supabase settings. */

        if(
          !data.session
        ){

          authMessage.textContent=
            "Account created. Check your email to confirm your account, then log in.";

          authButton.disabled=false;

          return;

        }


        await startGame();

      }

    }catch(error){

      console.error(error);

      authMessage.textContent =
        error?.message ||
        "Something went wrong.";

    }finally{

      authButton.disabled=false;

    }

  }
);


/* =========================
   START GAME
========================= */

async function startGame(){

  authScreen.classList.add(
    "hidden"
  );

  gameScreen.classList.remove(
    "hidden"
  );


  loadLocal();

  await loadCloudProfile();


  /* Safety check */

  if(
    !game.character.name
  ){

    game.character.name =
      "Player";

  }


  if(
    game.character.age<18 ||
    game.character.age>50
  ){

    game.character.age=18;

  }


  running=true;

  lastFrame=0;

  updateHUD();

  requestAnimationFrame(
    gameLoop
  );

}


/* =========================
   EXISTING SESSION
========================= */

(async function(){

  try{

    const {
      data:{
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if(
      session &&
      session.user
    ){

      currentUser =
        session.user;

      await startGame();

    }

  }catch(error){

    console.warn(
      "Session check failed:",
      error
    );

  }

})();


/* =========================
   AUTO SAVE
========================= */

setInterval(
  () => {

    if(
      running &&
      currentUser
    ){

      saveGame();

    }

  },
  30000
);


/* =========================
   VISIBILITY SAVE
========================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden &&
      running
    ){

      saveGame();

    }

  }
);


/* =========================
   PREVENT MOBILE PAGE SCROLL
========================= */

document.addEventListener(
  "touchmove",
  e => {

    if(
      e.target.closest(
        "#gameScreen"
      )
    ){

      e.preventDefault();

    }

  },
  {
    passive:false
  }
);
