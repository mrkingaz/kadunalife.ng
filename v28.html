.sidebar{

.logo{

}

.grid{
display:grid;

}

.item{

border-radius:12px;
padding:15px;

.item p{

background:#1d4ed8;

height:8px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
margin:8px 0;
}

.progress div{
height:100%;
background:#3b82f6;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.log{
max-height:320px;
overflow:auto;
}

.log div{
padding:9px;

position:fixed;
inset:0;
background:rgba(0,0,0,.78);
display:flex;
align-items:center;
justify-content:center;
z-index:1000;
padding:18px;

background:#0d1b2e;
border:1px solid #30445e;
border-radius:18px;
width:min(650px,100%);
max-height:90vh;
overflow:auto;
padding:22px;

.lottery{

function money(n){

return "₦"+Number(n||0).toLocaleString();

}


function log(text){

game.logs.unshift(
"Day "+game.day+
" • "+game.time+
" — "+text
);

if(game.logs.length>100)
game.logs.pop();

}


function clampStats(){

game.health=Math.max(0,Math.min(100,game.health));

game.energy=Math.max(0,Math.min(120,game.energy));

game.mood=Math.max(0,Math.min(100,game.mood));

game.education=Math.max(0,game.education);

game.reputation=Math.max(0,game.reputation);

}


function updateStats(){

document.getElementById("cash").textContent=money(game.cash);

document.getElementById("health").textContent=game.health;

document.getElementById("energy").textContent=game.energy;

document.getElementById("mood").textContent=game.mood;

document.getElementById("education").textContent=game.education;

document.getElementById("reputation").textContent=game.reputation;

document.getElementById("day").textContent=game.day;

}


function saveGame(){

localStorage.setItem(KEY,JSON.stringify(game));

}


function load(){

const saved=localStorage.getItem(KEY);

if(saved){

try{

game=JSON.parse(saved);

migrateSave();

render();

}catch(e){

localStorage.removeItem(KEY);

start();

}

}else{

start();

}

}


function migrateSave(){

if(!game.version)
game.version=28;

if(!game.news)
game.news=[];

if(!game.phoneNotifications)
game.phoneNotifications=[];

if(!game.invites)
game.invites=[];

if(!game.stats)
game.stats={};

game.stats.days=game.stats.days||0;
game.stats.activities=game.stats.activities||0;

if(!game.npcs || !game.npcs.length){

game.npcs=JSON.parse(
JSON.stringify(npcTemplates)
);

}

game.npcs.forEach(n=>{

const template=npcTemplates.find(
x=>x.id===n.id
);

if(template){

n.routine=n.routine||template.routine;
n.home=n.home||template.home;
n.memory=n.memory||[];

}

});

}


function start(){

document
.getElementById("startModal")
.classList.remove("hidden");

}


function startLife(){

const name=document
.getElementById("playerName")
.value
.trim();

if(!name){

alert("Enter your name first.");

return;

}

game=base();

game.name=name;

game.age=Number(
document.getElementById("playerAge").value
);

game.npcs=JSON.parse(
JSON.stringify(npcTemplates)
);

document

.classList.add("hidden");

showLottery();

}


function weightedLottery(){

let total=lottery.reduce(
(a,b)=>a+b.chance,0
);

let r=Math.random()*total;

for(const item of lottery){

r-=item.chance;

if(r<=0)
return item;

}

return lottery[lottery.length-1];

}


let chosenLottery=null;


function showLottery(){

document
.getElementById("lotteryModal")
.classList.remove("hidden");

const title=
document.getElementById("lotteryTitle");

const icon=
document.getElementById("lotteryIcon");

const desc=
document.getElementById("lotteryDescription");

const stats=
document.getElementById("lotteryStats");

const btn=
document.getElementById("continueLottery");

btn.classList.add("hidden");

let spins=0;

const spin=setInterval(()=>{

const temp=
lottery[
Math.floor(Math.random()*lottery.length)
];

icon.textContent=temp.icon;

title.textContent=temp.name;

spins++;

if(spins>=15){

clearInterval(spin);

chosenLottery=weightedLottery();

icon.textContent=chosenLottery.icon;

title.textContent=chosenLottery.name;

desc.textContent=
chosenLottery.description;

stats.innerHTML=`

<div class="grid">

<div class="item">
<strong>Starting Cash</strong>
<p>${money(chosenLottery.cash)}</p>
</div>

<div class="item">
<strong>Education</strong>
<p>${chosenLottery.education}</p>
</div>

<div class="item">
<strong>Reputation</strong>
<p>${chosenLottery.reputation}</p>
</div>

<div class="item">
<strong>Debt</strong>
<p>${money(chosenLottery.debt)}</p>
</div>

</div>
`;

btn.classList.remove("hidden");

}

},100);

}


function finishLottery(){

game.background=chosenLottery.name;

game.cash=chosenLottery.cash;

game.education=chosenLottery.education;

game.reputation=chosenLottery.reputation;

game.debt=chosenLottery.debt;

if(chosenLottery.name==="Hustler Baby")
game.energy=110;

if(chosenLottery.name==="Lucky Baby"){

game.energy=105;
game.mood=90;

}

log(
"You started life as a "+
chosenLottery.name+"."
);

generateNews();

document
.getElementById("lotteryModal")
.classList.add("hidden");

saveGame();

render();

}


function currentTimeIndex(){

return [
"Morning",
"Afternoon",
"Evening",
"Night"
].indexOf(game.time);

}


function advanceTime(){

const times=[
"Morning",
"Afternoon",
"Evening",
"Night"
];

let index=currentTimeIndex();

index++;

if(index>=4){

index=0;

game.day++;

game.stats.days++;

dailyExpenses();

dailyNPCMovement();

generateNews();

randomEvent();

}

game.time=times[index];

updateInvites();

checkAchievements();

clampStats();

saveGame();

}


function advanceDay(){

game.day++;

game.time="Morning";

game.stats.days++;

dailyExpenses();

dailyNPCMovement();

generateNews();

randomEvent();

updateInvites();

checkAchievements();

clampStats();

saveGame();

}


function dailyExpenses(){

/* Simple daily living cost */

let expense=0;

if(game.home==="Family Home")
expense=300;

else if(game.home==="Single Room")
expense=500;

else if(game.home==="Self-Contained Flat")
expense=800;

else if(game.home==="Two-Bedroom Apartment")
expense=1200;

else
expense=2000;

if(game.cash>=expense){

game.cash-=expense;

log(
"Daily living expenses cost "+
money(expense)+"."
);

}

if(game.debt>0){

const payment=Math.min(
500,
game.debt,
Math.max(0,game.cash)
);

if(payment>0){

game.cash-=payment;
game.debt-=payment;

log(
"You paid "+
money(payment)+
" toward your debt."
);

}

}

}


function dailyNPCMovement(){

game.npcs.forEach(n=>{

const destination=
n.routine[game.time];

if(destination)
n.location=destination;

});

}


function randomEvent(){

const r=Math.random();

if(r<.08){

game.mood+=8;

log(
"✨ Something unexpectedly good happened today."
);

}

else if(r<.14){

game.energy-=7;

log(
"😮‍💨 The day was more tiring than expected."
);

}

else if(r<.19){

game.cash+=1000;

log(
"💰 You received a small unexpected ₦1,000 bonus."
);

}

else if(r<.23){

game.mood-=5;

log(
"😕 Something put you in a bad mood today."
);

}

else if(r<.26){

game.reputation+=2;

log(
"⭐ Someone spoke positively about you."
);

}

}


function generateNews(){

const item=
newsTemplates[
Math.floor(
Math.random()*newsTemplates.length
)
];

game.news.unshift({

day:game.day,
text:item

});

if(game.news.length>30)
game.news.pop();

game.phoneNotifications.unshift(
item
);

if(game.phoneNotifications.length>20)
game.phoneNotifications.pop();

}


function updateInvites(){

game.npcs.forEach(n=>{

if(
n.friendship>=25 &&
Math.random()<.12
){

const already=game.invites.find(
x=>
x.npc===n.id &&
x.day===game.day
);

if(!already){

game.invites.push({

npc:n.id,
day:game.day,
time:game.time,
text:
n.name+
" invited you to hang out around "+
locations[n.location].name+"."

});

game.phoneNotifications.unshift(
"📱 "+n.name+
" sent you an invitation."
);

}

}

});

}

if(!game.career){

alert("Choose a career first.");

page("careers");

if(game.energy<18){

"You are too tired to work. Rest first."
);

game.stats.worked++;

"You worked as "+
game.career.name+
" and earned "+
money(salary)+"."
);

advanceTime();

function handlePromotion(){

const required=
5*game.careerLevel;

if(game.careerXP>=required){

game.careerLevel++;

game.careerXP=0;

game.cash+=
game.careerLevel*2000;

game.reputation+=3;

log(
"🎉 Promotion! You reached career level "+
game.careerLevel+"."
);

}

}

log(
"You studied and improved your education."
);

render();

}

game.energy+=30;

game.health+=5;

game.mood+=5;

log(

);

render();

}

game.food--;

game.health+=3;

log("You ate a meal.");

if(game.cash<500){

alert("You need ₦500.");

return;

}

game.cash-=500;

game.food+=3;

game.mood+=4;

log(
"You went shopping and bought food."
);

advanceTime();

}

if(!locations[id])
return;

if(game.location===id){

alert("You're already here.");

return;

}

if(game.cash<300){

);

return;

}

game.cash-=300;

game.energy-=5;

game.location=id;

log(
"You travelled to "+
locations[id].name+"."
);

advanceTime();

function doActivity(index){

const list=
activities[game.location];

if(!list || !list[index])
return;

const a=list[index];

const cost=a[1];

if(cost<0 && game.cash<Math.abs(cost)){

alert("You don't have enough money.");

return;

}

if(cost<0)
game.cash+=cost;

game.mood+=a[2];

game.education+=a[3];

game.energy-=3;

game.stats.activities++;

log(
"You chose: "+
a[0]+"."
);

advanceTime();

render();

}

const c=careers[index];

if(game.education<c[2]){

alert(
"You need at least "+
c[2]+
" education for this career."
);

return;

}

game.career={
name:c[0],
salary:c[1]
};

game.careerXP=0;

game.careerLevel=1;

game.careerHistory.push(c[0]);

log(
"You started working as a "+
c[0]+"."
);

saveGame();

render();

}

if(game.education<p[3]){

}

function startBusiness(index){

const b=businesses[index];

if(game.businesses.includes(b[0])){

alert(
"You already own this business."
);

return;

}

if(game.cash<b[1]){

alert(
"You need "+
money(b[1])+
" to start this business."
);

return;

}

game.cash-=b[1];

game.businesses.push(b[0]);

game.reputation+=5;

log(
"You started a "+
b[0]+"."
);

saveGame();

render();

}


function operateBusiness(){

if(!game.businesses.length){

alert(
"You don't own a business."
);

return;

}

let income=0;
let expense=0;

game.businesses.forEach(name=>{

const b=
businesses.find(x=>x[0]===name);

if(b){

income+=b[2];
expense+=b[3];

}

});

const profit=income-expense;

game.cash+=profit;

game.reputation+=2;

log(
"Your businesses made "+
money(profit)+
" today."
);

advanceTime();

render();

}


function buyHome(index){

const h=homes[index];

if(game.home===h[0]){

alert(
"You already live here."
);

return;

}

if(game.cash<h[1]){

alert(
"You need "+
money(h[1])+"."
);

return;

}

game.cash-=h[1];

game.home=h[0];

game.mood+=h[2];

log(
"You moved into a "+
h[0]+"."
);

saveGame();

render();

}

const npc=
game.npcs.find(x=>x.id===id);

if(!npc)
return;

document

.classList.remove("hidden");

document
.getElementById("talkName")

" "+

document

.innerHTML=`

${npc.bio}
</p>

<p class="muted">
📍 Currently at:
${locations[npc.location].name}
</p>

`;

const options=[

"Ask how their day is going.",
"Talk about Kaduna.",
"Ask what they are working on.",
"Tell them something interesting."

];

document
.getElementById("talkOptions")
.innerHTML=

options.map((x,i)=>`

<div class="item"
style="margin-bottom:8px">

<button onclick="reply('${npc.id}',${i})">

${x}

</button>

</div>

`).join("");

function reply(id,index){

const npc=
game.npcs.find(x=>x.id===id);

if(!npc)
return;

const replies={

0:[
"Pretty good! Just trying to get through the day.",
"Today has been busy but I'm doing alright.",
"Not bad. Kaduna has been active today."
],

1:[
"Kaduna has plenty of interesting places.",
"There is always something happening somewhere.",
"I like exploring different parts of the city."
],

2:[
"I'm focused on building my future.",
"I've got a few things I'm working on.",
"I'm trying to improve myself."
],

3:[
"😂 That's actually interesting.",
"That's funny. I didn't know that about you.",
"Nice! We should talk more often."
]

};

const line=
replies[index][
Math.floor(
Math.random()*replies[index].length
)
];

npc.friendship+=
Math.floor(Math.random()*4)+2;

game.mood+=3;

game.reputation+=1;

game.stats.talked++;

if(!npc.memory)
npc.memory=[];

npc.memory.push(line);

if(npc.memory.length>10)
npc.memory.shift();

log(
"You had a conversation with "+
npc.name+"."
);

document
.getElementById("talkText")
.innerHTML=`

<p>
${line}
</p>

<p class="good">
Friendship with ${npc.name}
increased.
</p>

`;

document
.getElementById("talkOptions")
.innerHTML=

`<button onclick="closeTalk()">
Continue
</button>`;

saveGame();

}


function closeTalk(){

document
.getElementById("talkModal")
.classList.add("hidden");

render();

}


/* EVENTS */

function joinEvent(index){

const e=events[index];

if(game.eventsSeen.includes(e.name)){

alert(
"You already attended this event."
);

return;

}

if(
game.day%7!==e.day
){

alert(
"This event isn't happening today. Check again on its scheduled day."
);

return;

}

if(game.cash<e.price){

alert(
"You don't have enough money."
);

return;

}

game.cash-=e.price;

game.mood+=e.mood;

game.reputation+=e.rep;

game.eventsSeen.push(e.name);

game.stats.events++;

log(
"You attended "+
e.name+
" and had a great time!"
);

advanceTime();

render();

}

function acceptInvite(id){

const n=
game.npcs.find(x=>x.id===id);

if(!n)
return;

game.location=n.location;

game.mood+=8;

game.reputation+=1;

game.stats.talked++;

log(
"You accepted an invitation from "+
n.name+
" and met them at "+
locations[n.location].name+"."
);

game.invites=
game.invites.filter(
x=>x.npc!==id
);

advanceTime();

render();

}
