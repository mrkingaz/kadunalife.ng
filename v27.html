button.secondary{

button.danger{

h1,h2,h3{

.app{

.sidebar{
  width:230px;

  overflow-y:auto;

.logo{
  font-size:24px;

}

.nav button.active{

}

.main{
  margin-left:230px;
  width:calc(100% - 230px);
  padding:18px;
}

.topbar{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:18px;
}

.stat{
  background:#0d1b2e;
  border:1px solid #203047;
  padding:13px;
  border-radius:12px;
}

.stat small{
  color:#94a3b8;
  display:block;
  margin-bottom:5px;
}

.stat strong{
  font-size:17px;
}

.card{
  background:#0d1b2e;
  border:1px solid #203047;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:14px;
}

.item{
  background:#101f34;
  border:1px solid #263952;
  border-radius:12px;
  padding:15px;
}

.item p{
  color:#aab7c9;
  margin:7px 0;
  line-height:1.45;
}

.tag{
  display:inline-block;
  background:#1d4ed8;
  padding:4px 8px;
  border-radius:20px;
  font-size:12px;
  margin:3px;
}

.progress{
  height:8px;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0;
}

.progress div{
  height:100%;
  background:#3b82f6;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.log{
  max-height:300px;
  overflow:auto;
}

.log div{
  padding:9px;
  border-bottom:1px solid #1e2c40;
  color:#cbd5e1;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:18px;
}

.modalBox{
  background:#0d1b2e;
  border:1px solid #30445e;
  border-radius:18px;
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  padding:22px;

.lottery{

.lotteryIcon{

.npc{

.avatar{

.mapGrid{

.location{

.event{

.muted{

.good{

.bad{

.center{

.hidden{

game.education=Math.max(0,game.education);
game.reputation=Math.max(0,game.reputation);

}

function weightedLottery(){

let total=lottery.reduce((a,b)=>a+b.chance,0);

let r=Math.random()*total;

for(const item of lottery){

r-=item.chance;

if(r<=0)
return item;

}

return lottery[lottery.length-1];

}

btn.classList.add("hidden");

let spins=0;

const spin=setInterval(()=>{

const temp=lottery[Math.floor(Math.random()*lottery.length)];

icon.textContent=temp.icon;
title.textContent=temp.name;

spins++;

if(spins>=15){

clearInterval(spin);

chosenLottery=weightedLottery();

icon.textContent=chosenLottery.icon;
title.textContent=chosenLottery.name;

desc.textContent=chosenLottery.description;

stats.innerHTML=`

<div class="grid">

<div class="item">
<strong>Starting Cash</strong>
<p>${money(chosenLottery.cash)}</p>
</div>

<div class="item">
<strong>Education</strong>
<p>${chosenLottery.education}</p>
</div>

<div class="item">
<strong>Reputation</strong>
<p>${chosenLottery.reputation}</p>
</div>

<div class="item">
<strong>Debt</strong>
<p>${money(chosenLottery.debt)}</p>
</div>

</div>
`;

btn.classList.remove("hidden");

}

},100);

}


function finishLottery(){

game.background=chosenLottery.name;

game.cash=chosenLottery.cash;
game.education=chosenLottery.education;
game.reputation=chosenLottery.reputation;
game.debt=chosenLottery.debt;

if(chosenLottery.name==="Hustler Baby")
game.energy=110;

if(chosenLottery.name==="Lucky Baby"){

game.energy=105;
game.mood=90;

}

log(
"You started life as a "+chosenLottery.name+"."
);

document.getElementById("lotteryModal").classList.add("hidden");

saveGame();

render();

}


function advance(){

game.day++;

const times=["Morning","Afternoon","Evening","Night"];

game.time=times[(game.day-1)%4];

randomEvent();

checkAchievements();

clampStats();

saveGame();

}


function randomEvent(){

const r=Math.random();

if(r<.10){

game.mood+=5;

log("You had a surprisingly good day. 😊");

}

else if(r<.17){

game.energy-=5;

log("A tiring day leaves you exhausted.");

}

else if(r<.22){

game.cash+=1000;

log("You received a small unexpected ₦1,000 bonus.");

}

}


function work(){

if(!game.career){

alert("Choose a career first.");

page("careers");

return;

}

if(game.energy<18){

alert("You are too tired to work. Rest first.");

return;

}

const salary=game.career.salary;

game.cash+=salary;

game.energy-=18;

game.mood-=2;

game.careerXP++;

game.stats.worked++;

log(
"You worked as a "+game.career.name+
" and earned "+money(salary)+"."
);

handlePromotion();

advance();

}


function handlePromotion(){

const required=5*game.careerLevel;

if(game.careerXP>=required){

game.careerLevel++;

game.careerXP=0;

game.cash+=game.careerLevel*2000;

game.reputation+=3;

log(
"🎉 Promotion! You reached career level "+
game.careerLevel+"."
);

}

}


function study(){

if(game.energy<12){

alert("You need more energy.");

return;

}

game.education+=4;
game.energy-=12;
game.mood+=1;
game.stats.studied++;

log("You studied and improved your education.");

advance();

}


function rest(){

game.energy+=30;
game.health+=5;
game.mood+=5;

log("You rested and recovered.");

advance();

}


function eat(){

if(game.food<=0){

alert("You have no food. Buy some first.");

return;

}

game.food--;

game.energy+=12;
game.health+=3;

log("You ate a meal.");

advance();

}


function shop(){

if(game.cash<500){

alert("You need ₦500.");

return;

}

game.cash-=500;

game.food+=3;
game.mood+=4;

log("You went shopping and bought food.");

advance();

}


function travel(id){

if(!locations[id])
return;

if(game.location===id){

alert("You're already here.");

return;

}

if(game.cash<300){

alert("You need ₦300 for transport.");

return;

}

game.cash-=300;

game.energy-=5;

game.location=id;

game.stats.traveled++;

log("You travelled to "+locations[id].name+".");

advance();

page("map");

}


function chooseCareer(index){

const c=careers[index];

if(game.education<c[2]){

alert(
"You need at least "+c[2]+
" education for this career."
);

return;

}

game.career={
name:c[0],
salary:c[1]
};

game.careerXP=0;
game.careerLevel=1;

game.careerHistory.push(c[0]);

log("You started working as a "+c[0]+".");

saveGame();

render();

}


function studyPath(index){

const p=educationPaths[index];

if(game.education<p[3]){

alert(
"You need at least "+p[3]+" education."
);

return;

}

if(game.cash<p[1]){

alert("You don't have enough money.");

return;

}

game.cash-=p[1];
game.education+=p[2];

game.energy-=10;

log(
"You completed "+p[0]+
" and gained "+p[2]+" education."
);

advance();

}


function startBusiness(index){

const b=businesses[index];

if(game.businesses.includes(b[0])){

alert("You already own this business.");

return;

}

if(game.cash<b[1]){

alert("You need "+money(b[1])+" to start this business.");

return;

}

game.cash-=b[1];

game.businesses.push(b[0]);

game.reputation+=5;

log("You started a "+b[0]+".");

saveGame();

render();

}


function operateBusiness(){

if(!game.businesses.length){

alert("You don't own a business.");

return;

}

let income=0;

let expense=0;

game.businesses.forEach(name=>{

const b=businesses.find(x=>x[0]===name);

if(b){

income+=b[2];
expense+=b[3];

}

});

const profit=income-expense;

game.cash+=profit;
game.reputation+=2;

log(
"Your businesses operated for a profit of "+
money(profit)+"."
);

advance();

}


function buyHome(index){

const h=homes[index];

if(game.home===h[0]){

alert("You already live here.");

return;

}

if(game.cash<h[1]){

alert("You need "+money(h[1])+".");

return;

}

game.cash-=h[1];

game.home=h[0];

game.mood+=h[2];

log("You moved into a "+h[0]+".");

saveGame();

render();

}


function talk(id){

const npc=game.npcs.find(x=>x.id===id);

if(!npc)
return;

document.getElementById("talkModal").classList.remove("hidden");

document.getElementById("talkName").textContent=
npc.avatar+" "+npc.name;

document.getElementById("talkText").innerHTML=
"<p>"+npc.bio+"</p>";

const options=[

"Ask how their day is going.",
"Talk about Kaduna.",
"Ask what they are working on.",
"Tell them something interesting."

];

document.getElementById("talkOptions").innerHTML=
options.map((x,i)=>`

<div class="item" style="margin-bottom:8px">
<button onclick="reply('${npc.id}',${i})">
${x}
</button>
</div>

`).join("");

}


function reply(id,index){

const npc=game.npcs.find(x=>x.id===id);

if(!npc)
return;

const replies={

0:[
"Pretty good! Just trying to get through the day.",
"Today has been busy but I'm doing alright.",
"Not bad. Kaduna has been active today."
],

1:[
"Kaduna has plenty of interesting places.",
"There is always something happening somewhere.",
"I like exploring different parts of the city."
],

2:[
"I'm focused on building my future.",
"I've got a few things I'm working on.",
"I'm trying to improve myself."
],

3:[
"😂 That's actually interesting.",
"That's funny. I didn't know that about you.",
"Nice! We should talk more often."
]

};

const line=replies[index][Math.floor(Math.random()*replies[index].length)];

document.getElementById("talkText").innerHTML=
"<p>"+line+"</p>";

npc.friendship+=Math.floor(Math.random()*4)+2;

game.mood+=3;
game.reputation+=1;
game.stats.talked++;

if(!npc.memory)
npc.memory=[];

npc.memory.push(line);

log(
"You had a conversation with "+npc.name+"."
);

saveGame();

document.getElementById("talkOptions").innerHTML=

`<button onclick="closeTalk()">Continue</button>`;

}


function closeTalk(){

document.getElementById("talkModal").classList.add("hidden");

render();

}


function joinEvent(index){

const e=events[index];

if(game.eventsSeen.includes(e.name)){

alert("You already attended this event.");

return;

}

if(game.day%7!==e.day){

alert(
"This event isn't happening today. Check back on day "+
e.day+" of the week."
);

return;

}

if(game.cash<e.price){

alert("You don't have enough money for this event.");

return;

}

game.cash-=e.price;

game.mood+=e.mood;

game.reputation+=e.rep;

game.eventsSeen.push(e.name);

game.stats.events++;

log(
"You attended "+e.name+" and had a great time!"
);

advance();

}


function checkAchievements(){

achievementList.forEach(a=>{

if(
a[1]() &&
!game.achievements.includes(a[0])
){

game.achievements.push(a[0]);

log("🏆 Achievement unlocked: "+a[0]);

}

});

}


function newLife(){

if(!confirm("Start a completely new life? Your current V27 save will be deleted."))

return;

localStorage.removeItem(KEY);

game=base();

location.reload();

}


function page(name){

const content=document.getElementById("content");

if(name==="home"){

renderHome(content);

}

else if(name==="map"){

renderMap(content);

}

else if(name==="careers"){

renderCareers(content);

}

else if(name==="education"){

renderEducation(content);

}

else if(name==="social"){

renderSocial(content);

}

else if(name==="events"){

renderEvents(content);

}

else if(name==="business"){

renderBusiness(content);

}

else if(name==="lifestyle"){

renderLifestyle(content);

}

else if(name==="missions"){

renderMissions(content);

}

else if(name==="achievements"){

renderAchievements(content);

}

else if(name==="profile"){

renderProfile(content);

}

updateStats();

}
