<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Kaduna Life — V35</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#081018;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   AUTH
========================= */

#authScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#1d4056 0,#0d202c 42%,#05090d 100%);
  z-index:10000;
}

.authBox{
  width:min(420px,100%);
  background:rgba(10,19,27,.96);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:26px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#55d6ff;
}

.subtitle{
  text-align:center;
  color:#9fb0bc;
  margin:7px 0 22px;
}

.authTabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.authTabs button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:11px;
  background:#142530;
  color:#a9bdc9;
}

.authTabs button.active{
  background:#55d6ff;
  color:#061019;
  font-weight:800;
}

.authBox input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #29404e;
  background:#0b151c;
  color:#fff;
  outline:none;
}

.authBox input:focus{
  border-color:#55d6ff;
}

.primaryBtn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:10px;
  background:#55d6ff;
  color:#061019;
  font-weight:900;
}

.authMessage{
  min-height:20px;
  margin-top:12px;
  text-align:center;
  color:#ffca66;
  font-size:13px;
}

/* =========================
   CHARACTER CREATION
========================= */

#createScreen{
  position:fixed;
  inset:0;
  z-index:9000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    linear-gradient(135deg,#102b38,#071116 70%);
}

.createBox{
  width:min(430px,100%);
  padding:25px;
  border-radius:24px;
  background:#0c171f;
  border:1px solid rgba(255,255,255,.1);
}

.createBox h1{
  margin:0 0 7px;
}

.createBox p{
  color:#9fb0bc;
  margin-top:0;
}

.createBox label{
  display:block;
  margin-top:13px;
  color:#c8d5dc;
  font-size:13px;
}

.createBox input,
.createBox select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #29404e;
  background:#071017;
  color:#fff;
}

/* =========================
   GAME
========================= */

#gameScreen{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#101820;
}

#worldCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  z-index:50;
}

.hudLeft{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.hudCard{
  background:rgba(5,12,17,.86);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(8px);
  border-radius:13px;
  padding:9px 11px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.playerNameHud{
  font-weight:900;
  font-size:15px;
}

.money{
  color:#70e0a0;
  font-weight:800;
}

.statRow{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  font-size:12px;
  color:#b8c7cf;
}

.hudRight{
  display:flex;
  flex-direction:column;
  gap:7px;
  align-items:flex-end;
}

.onlineBadge{
  pointer-events:auto;
  background:rgba(5,12,17,.9);
  border:1px solid rgba(80,255,145,.3);
  border-radius:13px;
  padding:9px 12px;
  color:#79f0a4;
  font-size:13px;
  font-weight:900;
}

.onlineDot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#59ed8b;
  margin-right:6px;
  box-shadow:0 0 10px #59ed8b;
}

.menuBtn{
  pointer-events:auto;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  background:rgba(5,12,17,.9);
  color:#fff;
  padding:9px 12px;
  font-weight:800;
}

/* =========================
   MESSAGE / LOCATION
========================= */

#toast{
  position:absolute;
  left:50%;
  bottom:155px;
  transform:translateX(-50%);
  z-index:100;
  max-width:min(90vw,420px);
  text-align:center;
  padding:10px 15px;
  border-radius:13px;
  background:rgba(4,10,14,.9);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  font-size:13px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

#toast.show{
  opacity:1;
}

#locationPrompt{
  position:absolute;
  left:50%;
  top:62%;
  transform:translate(-50%,-50%);
  z-index:80;
  display:none;
  background:rgba(4,10,14,.93);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:13px 17px;
  text-align:center;
  min-width:210px;
}

#locationPrompt strong{
  display:block;
  font-size:15px;
}

#locationPrompt span{
  display:block;
  color:#9fb0bc;
  font-size:12px;
  margin-top:4px;
}

#enterBtn{
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:#55d6ff;
  color:#061019;
  padding:9px 15px;
  font-weight:900;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:absolute;
  left:15px;
  bottom:18px;
  z-index:90;
  width:175px;
  height:175px;
  user-select:none;
}

.pad{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(7,15,21,.78);
  color:#fff;
  font-size:23px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

.pad:active{
  background:#243b49;
}

#up{
  left:60px;
  top:0;
}

#left{
  left:0;
  top:60px;
}

#right{
  right:0;
  top:60px;
}

#down{
  left:60px;
  bottom:0;
}

#runBtn{
  position:absolute;
  right:17px;
  bottom:27px;
  z-index:90;
  width:72px;
  height:72px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  background:rgba(18,34,43,.88);
  color:#fff;
  font-weight:900;
  touch-action:none;
}

#runBtn.active{
  background:#55d6ff;
  color:#061019;
}

/* =========================
   PANELS
========================= */

#sidePanel{
  position:absolute;
  top:0;
  right:0;
  width:min(390px,92vw);
  height:100%;
  z-index:500;
  background:#09131a;
  border-left:1px solid rgba(255,255,255,.1);
  transform:translateX(105%);
  transition:.25s ease;
  overflow:auto;
  box-shadow:-20px 0 50px rgba(0,0,0,.4);
}

#sidePanel.open{
  transform:translateX(0);
}

.panelHeader{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  background:#09131a;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.panelHeader h2{
  margin:0;
  font-size:18px;
}

.closePanel{
  border:0;
  background:#182832;
  color:#fff;
  border-radius:10px;
  padding:8px 11px;
}

.panelContent{
  padding:15px;
}

.panelSection{
  margin-bottom:16px;
  background:#0d1a22;
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  padding:13px;
}

.panelSection h3{
  margin:0 0 9px;
}

.actionGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.actionBtn{
  border:1px solid rgba(255,255,255,.08);
  border-radius:11px;
  background:#152732;
  color:#fff;
  padding:11px 8px;
  font-size:12px;
  font-weight:800;
}

.actionBtn:active{
  transform:scale(.98);
}

/* =========================
   MODAL
========================= */

#modal{
  position:absolute;
  inset:0;
  z-index:800;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
}

#modal.show{
  display:flex;
}

.modalBox{
  width:min(420px,100%);
  max-height:85vh;
  overflow:auto;
  background:#0b171f;
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.modalBox h2{
  margin-top:0;
}

.modalButtons{
  display:grid;
  gap:8px;
}

.modalButtons button{
  padding:12px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.08);
  background:#162a35;
  color:#fff;
}

.modalButtons button.primary{
  background:#55d6ff;
  color:#061019;
  font-weight:900;
}

/* =========================
   ONLINE LIST
========================= */

.onlinePlayer{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px;
  border-radius:10px;
  background:#111f27;
  margin-top:7px;
}

.onlinePlayer .avatar{
  width:31px;
  height:31px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  color:#071017;
}

.onlinePlayer .name{
  font-weight:800;
  font-size:13px;
}

.onlinePlayer .status{
  color:#65e995;
  font-size:11px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){
  .logo{
    font-size:27px;
  }

  .authBox{
    padding:20px;
  }

  #hud{
    top:7px;
    left:7px;
    right:7px;
  }

  .hudCard{
    padding:7px 8px;
  }

  .statRow{
    font-size:10px;
    gap:5px;
  }

  .playerNameHud{
    font-size:13px;
  }

  .onlineBadge{
    font-size:11px;
    padding:8px 9px;
  }

  .menuBtn{
    padding:8px 9px;
    font-size:11px;
  }
}
</style>
</head>

<body>

<!-- =========================
     AUTH SCREEN
========================= -->

<div id="authScreen">

  <div class="authBox">

    <div class="logo">
      Kaduna <span>Life</span>
    </div>

    <div class="subtitle">
      V35 • Online Kaduna
    </div>

    <div class="authTabs">
      <button id="loginTab" class="active">Login</button>
      <button id="signupTab">Sign Up</button>
    </div>

    <input
      id="emailInput"
      type="email"
      autocomplete="email"
      placeholder="Email"
    >

    <input
      id="passwordInput"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >

    <button id="authBtn" class="primaryBtn">
      Login
    </button>

    <div id="authMessage" class="authMessage"></div>

  </div>

</div>


<!-- =========================
     CHARACTER CREATION
========================= -->

<div id="createScreen" class="hidden">

  <div class="createBox">

    <h1>Create Your Character</h1>

    <p>
      Welcome to Kaduna Life. Choose your character details.
    </p>

    <label for="characterName">
      Character name
    </label>

    <input
      id="characterName"
      maxlength="24"
      placeholder="Enter a name"
    >

    <label for="characterAge">
      Age
    </label>

    <input
      id="characterAge"
      type="number"
      min="18"
      max="50"
      placeholder="18–50"
    >

    <label for="characterGender">
      Character
    </label>

    <select id="characterGender">
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>

    <button
      id="createCharacterBtn"
      class="primaryBtn">
      Enter Kaduna
    </button>

    <div
      id="createMessage"
      class="authMessage">
    </div>

  </div>

</div>


<!-- =========================
     GAME SCREEN
========================= -->

<div id="gameScreen" class="hidden">

  <canvas id="worldCanvas"></canvas>


  <!-- HUD -->

  <div id="hud">

    <div class="hudLeft">

      <div class="hudCard">

        <div
          id="hudName"
          class="playerNameHud">
          Player
        </div>

        <div
          id="hudMoney"
          class="money">
          ₦0
        </div>

        <div class="statRow">

          <span>
            ❤️ <b id="hudHealth">100</b>
          </span>

          <span>
            ⚡ <b id="hudEnergy">100</b>
          </span>

          <span>
            🙂 <b id="hudMood">100</b>
          </span>

          <span>
            ⭐ <b id="hudRep">0</b>
          </span>

        </div>

        <div class="statRow">

          <span>
            Day <b id="hudDay">1</b>
          </span>

          <span id="hudCareer">
            Unemployed
          </span>

        </div>

      </div>

    </div>


    <div class="hudRight">

      <div
        id="onlineBadge"
        class="onlineBadge">

        <span class="onlineDot"></span>
        <span id="onlineCount">1</span>
        ONLINE

      </div>

      <button
        id="menuBtn"
        class="menuBtn">
        MENU
      </button>

    </div>

  </div>


  <!-- LOCATION PROMPT -->

  <div id="locationPrompt">

    <strong id="promptTitle">
      Location
    </strong>

    <span id="promptText">
      Press enter
    </span>

    <button id="enterBtn">
      ENTER
    </button>

  </div>


  <!-- TOAST -->

  <div id="toast"></div>


  <!-- MOBILE CONTROLS -->

  <div id="controls">

    <button
      id="up"
      class="pad"
      data-dir="up">
      ▲
    </button>

    <button
      id="left"
      class="pad"
      data-dir="left">
      ◀
    </button>

    <button
      id="right"
      class="pad"
      data-dir="right">
      ▶
    </button>

    <button
      id="down"
      class="pad"
      data-dir="down">
      ▼
    </button>

  </div>


  <button id="runBtn">
    RUN
  </button>


  <!-- SIDE PANEL -->

  <div id="sidePanel">

    <div class="panelHeader">

      <h2 id="panelTitle">
        Kaduna Life
      </h2>

      <button
        id="closePanel"
        class="closePanel">
        ✕
      </button>

    </div>

    <div
      id="panelContent"
      class="panelContent">
    </div>

  </div>


  <!-- MODAL -->

  <div id="modal">

    <div class="modalBox">

      <h2 id="modalTitle">
        Kaduna Life
      </h2>

      <div id="modalContent"></div>

      <div
        id="modalButtons"
        class="modalButtons">
      </div>

    </div>

  </div>

</div>

/* =========================================================
   NORMALIZE
========================================================= */

function normalize(){

  if(!game){
    game = defaultGame();
  }

  if(!game.character){
    game.character = {
      name:"",
      age:18,
      gender:"other"
    };
  }

  if(!Array.isArray(game.inventory)){
    game.inventory = [];
  }

  if(!game.friendship){
    game.friendship = {};
  }

  if(!Array.isArray(game.achievements)){
    game.achievements = [];
  }

  if(typeof game.cash !== "number"){
    game.cash = 50000;
  }

  if(typeof game.bank !== "number"){
    game.bank = 100000;
  }

  if(typeof game.health !== "number"){
    game.health = 100;
  }

  if(typeof game.energy !== "number"){
    game.energy = 100;
  }

  if(typeof game.mood !== "number"){
    game.mood = 100;
  }

  if(typeof game.reputation !== "number"){
    game.reputation = 0;
  }

  if(typeof game.day !== "number"){
    game.day = 1;
  }

  if(!game.career){
    game.career = "unemployed";
  }

  if(!game.transport){
    game.transport = "walking";
  }

  if(typeof game.x !== "number"){
    game.x = 800;
  }

  if(typeof game.y !== "number"){
    game.y = 520;
  }

  game.ageSafe =
    Math.max(
      18,
      Math.min(
        50,
        Number(game.character.age) || 18
      )
    );

}


/* =========================================================
   STORAGE KEY
========================================================= */

function storageKey(){

  if(!currentUser){
    return "kaduna_life_guest";
  }

  return "kaduna_life_v35_" + currentUser.id;
}


/* =========================================================
   LOCAL SAVE
========================================================= */

function saveLocal(){

  try{

    localStorage.setItem(
      storageKey(),
      JSON.stringify(game)
    );

  }catch(error){

    console.warn(
      "Local save failed:",
      error
    );

  }

}


/* =========================================================
   LOCAL LOAD
========================================================= */

function loadLocal(){

  try{

    const raw =
      localStorage.getItem(
        storageKey()
      );

    if(raw){

      game =
        JSON.parse(raw);

    }else{

      game =
        defaultGame();

    }

  }catch(error){

    console.warn(
      "Local load failed:",
      error
    );

    game =
      defaultGame();

  }

  normalize();

}


/* =========================================================
   SUPABASE PROFILE SAVE
========================================================= */

async function saveCloud(){

  if(!currentUser || !game){
    return;
  }

  try{

    const payload = {

      id:currentUser.id,

      name:
        game.character.name || "Player",

      age:
        Number(game.character.age) || 18,

      game_state:game

    };

    const {error} =
      await supabaseClient
        .from("profiles")
        .upsert(
          payload,
          {
            onConflict:"id"
          }
        );

    if(error){

      console.warn(
        "Cloud save warning:",
        error.message
      );

    }

  }catch(error){

    console.warn(
      "Cloud save error:",
      error
    );

  }

}


/* =========================================================
   PROFILE LOAD
========================================================= */

async function loadCloud(){

  if(!currentUser){
    return false;
  }

  try{

    const {data,error} =
      await supabaseClient
        .from("profiles")
        .select("game_state,name,age")
        .eq("id",currentUser.id)
        .maybeSingle();

    if(error){

      console.warn(
        "Profile load warning:",
        error.message
      );

      return false;
    }

    if(
      data &&
      data.game_state &&
      typeof data.game_state === "object"
    ){

      game = data.game_state;

      normalize();

      saveLocal();

      return true;
    }

  }catch(error){

    console.warn(
      "Profile load error:",
      error
    );

  }

  return false;
}

authBtn.addEventListener(
  "click",
  async ()=>{

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if(!email || !password){

      authMessage.textContent =
        "Enter your email and password.";

      return;
    }

    authBtn.disabled = true;

    authMessage.textContent =
      authMode === "login"
        ? "Logging in..."
        : "Creating account...";

    try{

      if(authMode === "login"){

        const {data,error} =
          await supabaseClient.auth
            .signInWithPassword({
              email,
              password
            });

        if(error){
          throw error;
        }

        currentUser =
          data.user;

        await startAfterAuth();

      }else{

        const {data,error} =
          await supabaseClient.auth
            .signUp({
              email,
              password
            });

        if(error){
          throw error;
        }

        if(data.user && data.session){

          currentUser =
            data.user;

          await startAfterAuth();

        }else{

          authMessage.textContent =
            "Account created. Check your email to confirm it, then log in.";

        }

      }

    }catch(error){

      authMessage.textContent =
        error.message || "Authentication failed.";

    }

    authBtn.disabled = false;

  }
);

async function checkSession(){

  try{

      await supabaseClient.auth
        .getSession();

    if(

      data.session.user
    ){

    }

    );

}

========================================================= */

async function startAfterAuth(){

  authScreen.classList.add("hidden");

/* =========================================================

========================================================= */

function resizeCanvas(){

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    window.innerWidth * ratio;

  canvas.height =
    window.innerHeight * ratio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const screenW =
    window.innerWidth;

  const screenH =
    window.innerHeight;

  camera.x =
    game.x -
    screenW / 2;

  camera.y =
    game.y -
    screenH / 2;

  camera.x =
    Math.max(
      0,
      Math.min(
        WORLD_WIDTH - screenW,
        camera.x
      )
    );

  camera.y =
    Math.max(
      0,
      Math.min(
        WORLD_HEIGHT - screenH,
        camera.y
      )
    );

}


/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  /* background */

  ctx.fillStyle =
    "#19372b";

  ctx.fillRect(
    0,
    0,
    WORLD_WIDTH,
    WORLD_HEIGHT
  );


  /* grid */

  ctx.strokeStyle =
    "rgba(255,255,255,.025)";

  ctx.lineWidth = 1;

  for(
    let x=0;
    x<=WORLD_WIDTH;
    x+=50
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,WORLD_HEIGHT);

    ctx.stroke();

  }

  for(
    let y=0;
    y<=WORLD_HEIGHT;
    y+=50
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(WORLD_WIDTH,y);

    ctx.stroke();

  }


  /* roads */

  drawRoad(
    0,
    520,
    WORLD_WIDTH,
    105
  );

  drawRoad(
    1080,
    0,
    110,
    WORLD_HEIGHT
  );

  drawRoad(
    0,
    1020,
    WORLD_WIDTH,
    95
  );

  drawRoad(
    600,
    0,
    85,
    WORLD_HEIGHT
  );


  /* river */

  ctx.fillStyle =
    "#1a5169";

  ctx.fillRect(
    0,
    0,
    80,
    WORLD_HEIGHT
  );


  /* locations */

  locations.forEach(
    drawLocation
  );


  /* trees */

  drawTrees();


  /* NPCs */

  npcs.forEach(
    drawNPC
  );


  /* remote players */

  Object
    .values(remotePlayers)
    .forEach(
      drawRemotePlayer
    );


  /* local player */

  drawPlayer();


  ctx.restore();

}


/* =========================================================
   ROAD
========================================================= */

function drawRoad(
  x,
  y,
  width,
  height
){

  ctx.fillStyle =
    "#333b40";

  ctx.fillRect(
    x,
    y,
    width,
    height
  );

  ctx.strokeStyle =
    "#d6c96b";

  ctx.lineWidth = 4;

  if(width > height){

    for(
      let px=x+20;
      px<x+width;
      px+=65
    ){

      ctx.beginPath();

      ctx.moveTo(
        px,
        y + height/2
      );

      ctx.lineTo(
        px+32,
        y + height/2
      );

      ctx.stroke();

    }

  }else{

    for(
      let py=y+20;
      py<y+height;
      py+=65
    ){

      ctx.beginPath();

      ctx.moveTo(
        x + width/2,
        py
      );

      ctx.lineTo(
        x + width/2,
        py+32
      );

      ctx.stroke();

    }

  }

}

/* =========================================================
   COLLISION
========================================================= */

function isInsideBuilding(x,y){

  for(
    const location of locations
  ){

    if(
      x > location.x-18 &&
      x < location.x + location.w + 18 &&
      y > location.y-18 &&
      y < location.y + location.h + 18
    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(dt){

  let dx = 0;
  let dy = 0;

  if(keys.up){
    dy -= 1;
  }

  if(keys.down){
    dy += 1;
  }

  if(keys.left){
    dx -= 1;
  }

  if(keys.right){
    dx += 1;
  }

  if(
    dx === 0 &&
    dy === 0
  ){
    return;
  }


  const length =
    Math.sqrt(
      dx*dx + dy*dy
    );

  dx /= length;
  dy /= length;


  const speed =
    keys.run
      ? 240
      : 155;


  const nx =
    game.x + dx * speed * dt;

  const ny =
    game.y + dy * speed * dt;


  const margin = 25;


  if(
    nx > margin &&
    nx < WORLD_WIDTH-margin &&
    !isInsideBuilding(nx,game.y)
  ){

    game.x = nx;

  }


  if(
    ny > margin &&
    ny < WORLD_HEIGHT-margin &&
    !isInsideBuilding(game.x,ny)
  ){

    game.y = ny;

  }

}


/* =========================================================
   NPC MOVEMENT
========================================================= */

function updateNPCs(dt){

  npcs.forEach(
    npc=>{

      npc.x += npc.vx * dt;
      npc.y += npc.vy * dt;


      if(
        Math.random() < .005
      ){

        npc.vx =
          (Math.random()-.5)*40;

        npc.vy =
          (Math.random()-.5)*40;

      }


      if(
        npc.x < 100 ||
        npc.x > WORLD_WIDTH-100
      ){

        npc.vx *= -1;

      }

      if(
        npc.y < 100 ||
        npc.y > WORLD_HEIGHT-100
      ){

        npc.vy *= -1;

      }


      if(
        isInsideBuilding(
          npc.x,
          npc.y
        )
      ){

        npc.vx *= -1;
        npc.vy *= -1;

      }

    }
  );

}


/* =========================================================
   FIND NEAREST LOCATION
========================================================= */

function findNearbyLocation(){

  let nearest = null;

  let nearestDistance =
    Infinity;

  locations.forEach(
    location=>{

      const cx =
        location.x +
        location.w/2;

      const cy =
        location.y +
        location.h/2;

      const distance =
        Math.hypot(
          game.x-cx,
          game.y-cy
        );

      if(
        distance < nearestDistance
      ){

        nearestDistance =
          distance;

        nearest =
          location;

      }

    }
  );


  if(
    nearest &&
    nearestDistance < 110
  ){

    return nearest;

  }

  return null;

}


/* =========================================================
   FIND NEAREST NPC
========================================================= */

function findNearbyNPC(){

  let nearest = null;

  let nearestDistance =
    Infinity;

  npcs.forEach(
    npc=>{

      const distance =
        Math.hypot(
          game.x-npc.x,
          game.y-npc.y
        );

      if(
        distance < nearestDistance
      ){

        nearestDistance =
          distance;

        nearest =
          npc;

      }

    }
  );


  if(
    nearest &&
    nearestDistance < 75
  ){

    return nearest;

  }

  return null;

}

   LOCATION PROMPT
========================================================= */

function updatePrompt(){

  const location =
    findNearbyLocation();

  const npc =
    findNearbyNPC();


  if(location){

    currentLocation =
      location;

    selectedNPC =
      null;

    locationPrompt.style.display =
      "block";

    promptTitle.textContent =
      location.icon +
      " " +
      location.name;

    promptText.textContent =
      "You are near this location.";

    return;

  }


  if(npc){

    selectedNPC =
      npc;

    currentLocation =
      null;

    locationPrompt.style.display =
      "block";

    promptTitle.textContent =
      "👤 " +

    promptText.textContent =
      "Press ENTER to interact.";

  currentLocation =
    null;

  selectedNPC =

  locationPrompt.style.display =

function openLocation(id){

  const location =

  switch(id){

/* =========================================================
   MODAL
========================================================= */

function showModal(
  title,
  content,
  buttons=[]
){

  modalTitle.textContent =
    title;

  modalContent.innerHTML =
    content;

  modalButtons.innerHTML =
    "";

  buttons.forEach(
    button=>{

      const el =
        document.createElement("button");

      el.textContent =
        button.label;

      if(button.primary){
        el.classList.add("primary");
      }

      el.addEventListener(
        "click",
        ()=>{

          if(button.action){
            button.action();
          }

        }
      );

      modalButtons.appendChild(el);

    }
  );

  modal.classList.add("show");

}


function closeModal(){

  modal.classList.remove(
    "show"
  );

}

modal.addEventListener(
  "click",
  event=>{

    if(event.target === modal){
      closeModal();
    }

  }
);

function renderOnlinePlayersList(){

  const list =
    document.getElementById(
      "onlinePlayersList"
    );

  if(!list){
    return;
  }

  const players =
    Object.values(
      remotePlayers
    );


  if(!players.length){

    list.innerHTML =
      `
        <p style="color:#9fb0bc;">
          You're currently the only other player visible.
        </p>
      `;

    return;

  }


  list.innerHTML =
    players
      .map(
        player=>`

          <div class="onlinePlayer">

            <div
              class="avatar"
              style="
                background:
                ${player.color || "#ffca55"};
              ">

              ${(player.name || "P")
                .charAt(0)
                .toUpperCase()}

            </div>

            <div>

              <div class="name">
                ${escapeHTML(
                  player.name || "Player"
                )}
              </div>

              <div class="status">
                ● ONLINE
              </div>

            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =========================================================

========================================================= */

async function logoutGame(){

  await saveCloud();

  if(realtimeChannel){

    try{
      await realtimeChannel.untrack();
    }catch(e){}

    try{
      await supabaseClient
        .removeChannel(
          realtimeChannel
        );
    }catch(e){}

    realtimeChannel =
      null;

  }

  remotePlayers = {};

  running = false;

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================================================
   REALTIME MULTIPLAYER
========================================================= */

async function connectRealtime(){

  if(!currentUser){

    console.warn(
      "Realtime skipped: no user."
    );

    return;

  }


  /* Prevent duplicate channels */

  if(realtimeChannel){

    try{

      await supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }catch(error){}

    realtimeChannel =
      null;

  }


  /*
    One shared Kaduna world.

    Presence:
      - online users
      - names
      - character information

    Broadcast:
      - frequent movement updates

    This follows Supabase's recommended
    split between slow-changing presence
    and high-frequency Broadcast data.
  */

  realtimeChannel =
    supabaseClient.channel(
      "kaduna-world",
      {
        config:{
          presence:{
            key:currentUser.id
          },

          broadcast:{
            self:false
          }
        }
      }
    );


  /* =========================
     BROADCAST MOVEMENT
  ========================= */

  realtimeChannel.on(
    "broadcast",
    {
      event:"player-move"
    },
    payload=>{

      const data =
        payload &&
        payload.payload;

      if(!data){
        return;
      }

      if(
        !data.userId ||
        data.userId === currentUser.id
      ){
        return;
      }


      remotePlayers[data.userId] =
        {

          id:data.userId,

          name:
            data.name ||
            "Player",

          x:Number(data.x),

          y:Number(data.y),

          color:
            data.color ||
            "#ffca55",

          updatedAt:
            Date.now()

        };


      updateOnlineCount();

      renderOnlinePlayersList();

    }
  );


  /* =========================
     PRESENCE SYNC
  ========================= */

  realtimeChannel.on(
    "presence",
    {
      event:"sync"
    },
    ()=>{

      syncPresencePlayers();

    }
  );


  /* =========================
     PRESENCE JOIN
  ========================= */

  realtimeChannel.on(
    "presence",
    {
      event:"join"
    },
    ({newPresences})=>{

      addPresencePlayers(
        newPresences
      );

    }
  );


  /* =========================
     PRESENCE LEAVE
  ========================= */

  realtimeChannel.on(
    "presence",
    {
      event:"leave"
    },
    ({leftPresences})=>{

      removePresencePlayers(
        leftPresences
      );

    }
  );


  /* =========================
     SUBSCRIBE
  ========================= */

  realtimeChannel.subscribe(
    async status=>{

      console.log(
        "Kaduna Realtime:",
        status
      );


      if(
        status === "SUBSCRIBED"
      ){

        realtimeReady =
          true;


        /*
          Presence is used only for
          online/identity state.
        */

        await realtimeChannel.track({

          userId:
            currentUser.id,

          name:
            game.character.name ||
            "Player",

          age:
            Number(game.character.age) || 18,

          color:
            getPlayerColor(),

          onlineAt:
            new Date().toISOString()

        });


        updateOnlineCount();

        showToast(
          "🌐 Connected to online Kaduna"
        );

      }


      if(
        status === "CHANNEL_ERROR"
      ){

        realtimeReady =
          false;

        showToast(
          "Online connection error."
        );

      }


      if(
        status === "TIMED_OUT"
      ){

        realtimeReady =
          false;

        showToast(
          "Online connection timed out."
        );

      }

    }
  );

}


/* =========================================================
   PRESENCE SYNC
========================================================= */

function syncPresencePlayers(){

  if(!realtimeChannel){
    return;
  }

  const state =
    realtimeChannel.presenceState();

  const fresh = {};


  Object
    .entries(state)
    .forEach(
      ([key,metas])=>{

        if(
          !Array.isArray(metas)
        ){
          return;
        }

        metas.forEach(
          meta=>{

            const id =
              meta.userId ||
              key;

            if(
              id === currentUser.id
            ){
              return;
            }


            fresh[id] = {

              id:id,

              name:
                meta.name ||
                "Player",

              x:
                Number(meta.x) ||
                800,

              y:
                Number(meta.y) ||
                520,

              color:
                meta.color ||
                "#ffca55",

              updatedAt:
                Date.now()

            };

          }
        );

      }
    );


  /*
    Presence should not be used
    for rapid movement, so the
    initial position comes from
    presence and subsequent
    movement comes through
    Broadcast.
  */

  Object.assign(
    remotePlayers,
    fresh
  );


  /*
    Remove players no longer
    in presence.
  */

  Object
    .keys(remotePlayers)
    .forEach(
      id=>{

        if(!fresh[id]){

          delete remotePlayers[id];

        }

      }
    );


  updateOnlineCount();

  renderOnlinePlayersList();

}


/* =========================================================
   PRESENCE JOIN
========================================================= */

function addPresencePlayers(
  presences
){

  if(!Array.isArray(presences)){
    return;
  }

  presences.forEach(
    meta=>{

      const id =
        meta.userId;

      if(
        !id ||
        id === currentUser.id
      ){
        return;
      }


      remotePlayers[id] = {

        id:id,

        name:
          meta.name ||
          "Player",

        x:
          Number(meta.x) ||
          800,

        y:
          Number(meta.y) ||
          520,

        color:
          meta.color ||
          "#ffca55",

        updatedAt:
          Date.now()

      };

    }
  );


  updateOnlineCount();

  renderOnlinePlayersList();

}


/* =========================================================
   PRESENCE LEAVE
========================================================= */

function removePresencePlayers(
  presences
){

  if(!Array.isArray(presences)){
    return;
  }

  presences.forEach(
    meta=>{

      if(meta.userId){

        delete remotePlayers[
          meta.userId
        ];

      }

    }
  );


  updateOnlineCount();

  renderOnlinePlayersList();

}


/* =========================================================
   ONLINE COUNT
========================================================= */

function updateOnlineCount(){

  const count =
    1 +
    Object.keys(
      remotePlayers
    ).length;

  onlineCount.textContent =
    count;

}


/* =========================================================
   PLAYER COLOR
========================================================= */

function getPlayerColor(){

  const colors = [

    "#55d6ff",
    "#ffca55",
    "#ff83a8",
    "#8edb91",
    "#d99cff",
    "#f0a15c",
    "#7ec8ff"

  ];


  let hash = 0;

  const id =
    currentUser
      ? currentUser.id
      : "player";


  for(
    let i=0;
    i<id.length;
    i++
  ){

    hash =
      (
        hash * 31 +
        id.charCodeAt(i)
      ) >>> 0;

  }


  return colors[
    hash % colors.length
  ];

}


/* =========================================================
   BROADCAST PLAYER POSITION
========================================================= */

async function broadcastPosition(){

  if(
    !realtimeReady ||
    !realtimeChannel ||
    !currentUser ||
    !game
  ){
    return;
  }


  const now =
    performance.now();


  /*
    Send movement approximately
    every 100ms.

    This uses Broadcast instead
    of repeatedly calling Presence.
  */

  if(
    now -
    lastBroadcastTime <
    100
  ){

    return;

  }


  lastBroadcastTime =
    now;


  try{

    await realtimeChannel.send({

      type:"broadcast",

      event:"player-move",

      payload:{

        userId:
          currentUser.id,

        name:
          game.character.name ||
          "Player",

        x:
          Math.round(game.x),

        y:
          Math.round(game.y),

        color:
          getPlayerColor(),

        timestamp:
          Date.now()

      }

    });

  }catch(error){

    console.warn(
      "Movement broadcast failed:",
      error
    );

  }

}


/* =========================================================
   CLEAN STALE REMOTE PLAYERS
========================================================= */

function cleanRemotePlayers(){

  const now =
    Date.now();

  Object
    .keys(remotePlayers)
    .forEach(
      id=>{

        const player =
          remotePlayers[id];

        /*
          Only remove players that
          haven't sent movement for
          a long time AND are no
          longer in the Presence
          state.
        */

        if(
          player.updatedAt &&
          now - player.updatedAt > 30000
        ){

          delete remotePlayers[id];

        }

      }
    );


  updateOnlineCount();

}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  event=>{

    const key =
      event.key.toLowerCase();


    if(
      [
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        "w",
        "a",
        "s",
        "d",
        "shift",
        "enter"
      ].includes(key)
    ){

      event.preventDefault();

    }


    if(
      key === "arrowup" ||
      key === "w"
    ){

      keys.up = true;

    }

    if(
      key === "arrowdown" ||
      key === "s"
    ){

      keys.down = true;

    }

    if(
      key === "arrowleft" ||
      key === "a"
    ){

      keys.left = true;

    }

    if(
      key === "arrowright" ||
      key === "d"
    ){

      keys.right = true;

    }

    if(key === "shift"){

      keys.run = true;

    }

    if(key === "enter"){

      enterNearby();

    }

  }
);


window.addEventListener(
  "keyup",
  event=>{

    const key =
      event.key.toLowerCase();


    if(
      key === "arrowup" ||
      key === "w"
    ){

      keys.up = false;

    }

    if(
      key === "arrowdown" ||
      key === "s"
    ){

      keys.down = false;

    }

    if(
      key === "arrowleft" ||
      key === "a"
    ){

      keys.left = false;

    }

    if(
      key === "arrowright" ||
      key === "d"
    ){

      keys.right = false;

    }

    if(key === "shift"){

      keys.run = false;

    }

  }
);


/* =========================================================
   TOUCH CONTROLS
========================================================= */

document
  .querySelectorAll(".pad")
  .forEach(
    button=>{

      const dir =
        button.dataset.dir;


      const start = event=>{
        event.preventDefault();

        keys[dir] =
          true;
      };


      const end = event=>{
        event.preventDefault();

        keys[dir] =
          false;
      };


      button.addEventListener(
        "touchstart",
        start,
        {
          passive:false
        }
      );

      button.addEventListener(
        "touchend",
        end,
        {
          passive:false
        }
      );

      button.addEventListener(
        "touchcancel",
        end,
        {
          passive:false
        }
      );

      button.addEventListener(
        "mousedown",
        start
      );

      button.addEventListener(
        "mouseup",
        end
      );

      button.addEventListener(
        "mouseleave",
        end
      );

    }
  );


/* =========================================================
   RUN BUTTON
========================================================= */

const runBtn =
  document.getElementById(
    "runBtn"
  );


function startRun(event){

  event.preventDefault();

  keys.run =
    true;

  runBtn.classList.add(
    "active"
  );

}


function stopRun(event){

  event.preventDefault();

  keys.run =
    false;

  runBtn.classList.remove(
    "active"
  );

}


runBtn.addEventListener(
  "touchstart",
  startRun,
  {
    passive:false
  }
);

runBtn.addEventListener(
  "touchend",
  stopRun,
  {
    passive:false
  }
);

runBtn.addEventListener(
  "touchcancel",
  stopRun,
  {
    passive:false
  }
);

runBtn.addEventListener(
  "mousedown",
  startRun
);

runBtn.addEventListener(
  "mouseup",
  stopRun
);

runBtn.addEventListener(
  "mouseleave",
  stopRun
);


/* =========================================================
   ENTER BUTTON
========================================================= */

enterBtn.addEventListener(
  "click",
  enterNearby
);


/* =========================================================
   GAME LOOP
========================================================= */

let previousTime =
  performance.now();


function gameLoop(time){

  if(!running){
    return;
  }


  const dt =
    Math.min(
      (time - previousTime) / 1000,
      .05
    );


  previousTime =
    time;


  movePlayer(dt);

  updateNPCs(dt);

  updateCamera();

  updatePrompt();

  broadcastPosition();

  cleanRemotePlayers();

  drawWorld();

  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   AUTO SAVE
========================================================= */

setInterval(
  ()=>{
    if(
      running &&
      game
    ){

      saveLocal();

    }

  },
  5000
);


/* =========================================================
   CLOUD SAVE
========================================================= */

setInterval(
  ()=>{
    if(
      running &&
      currentUser &&
      game
    ){

      saveCloud();

    }

  },
  30000
);


/* =========================================================
   PERIODIC ONLINE LIST REFRESH
========================================================= */

setInterval(
  ()=>{
    if(
      realtimeReady
    ){

      updateOnlineCount();

    }

  },
  3000
);


/* =========================================================
   BEFORE LEAVING
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    saveLocal();
  }
);


/* =========================================================
   STARTUP
========================================================= */

checkSession();

</script>
